<div class="modal fade" id="productDetailModal" tabindex="-1" aria-labelledby="productDetailModalLabel" aria-hidden="true" aria-modal="true" role="dialog" th:fragment="product-detail-modal">
    <div class="modal-dialog modal-dialog-centered modal-xl modal-16-9">
        <div class="modal-content border border-light shadow-lg d-flex flex-column" style="background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(28px); border-radius: 1.5rem; overflow: hidden; max-height: 90vh;">
            <button type="button" class="btn-close position-absolute top-0 end-0 m-3 m-md-4 z-3 bg-white rounded-circle shadow-sm p-2" data-bs-dismiss="modal" aria-label="Đóng chi tiết sản phẩm"></button>
            
            <div class="modal-body p-4 p-md-5 d-flex flex-column flex-grow-1 overflow-hidden" style="min-height: 0;">
                <div class="row g-4 g-md-5 h-100 flex-grow-1">
                    
                    <!-- Left: Images -->
                    <div class="col-12 col-md-5 col-lg-6 d-flex flex-column gap-3 h-100">
                        <div class="detail-img-wrapper flex-grow-1 rounded-4 overflow-hidden position-relative bg-white shadow-sm border" style="min-height: 300px;">
                            <img th:if="${productDTO != null and !productDTO.images.empty}" th:src="${productDTO.images[0].imageUrl}" class="img-fluid w-100 h-100" style="object-fit: cover; border-radius: 1rem; position: absolute; z-index: 0;"/>
                            <i th:unless="${productDTO != null and !productDTO.images.empty}" class="bi bi-image text-muted opacity-25" style="font-size: 8rem;"></i>
                        </div>
                        <div class="d-flex gap-2 overflow-x-auto pb-2 custom-scrollbar" th:if="${productDTO != null}">
                            <div th:each="img : ${productDTO.images}" class="thumbnail-wrapper rounded-3 border bg-white flex-shrink-0" style="width: 80px; height: 80px; cursor: pointer;">
                                <img th:src="${img.imageUrl}" class="w-100 h-100 rounded-3" style="object-fit: cover;" />
                            </div>
                        </div>
                    </div>
                    
                    <!-- Right: Info -->
                    <div class="col-12 col-md-7 col-lg-6 d-flex flex-column h-100 overflow-y-auto pe-md-2 custom-scrollbar">
                        <div class="d-flex flex-column h-100" th:if="${productDTO != null}">
                            
                            <form th:action="@{/cart/add}" method="POST" class="d-flex flex-column h-100" id="addToCartForm">
                                <!-- Hidden inputs for Form -->
                                <input type="hidden" name="variantId" id="selectedVariantId" />
                                <input type="hidden" name="storeId" id="selectedStoreId" />
                                <input type="hidden" name="quantity" value="1" id="selectedQuantity" />
                                
                                <div class="d-flex align-items-center gap-2 mb-2">
                                    <span class="badge text-cyan bg-cyan bg-opacity-10 fw-semibold fs-6 px-2 py-1" th:text="${productDTO.categoryName}">Category</span>
                                    <span class="badge text-muted-custom bg-light fw-semibold fs-6 px-2 py-1 ms-2" th:text="${productDTO.brandName}">Brand</span>
                                </div>
                                
                                <div class="d-flex align-items-start justify-content-between gap-2 gap-sm-3 mb-3">
                                    <h2 class="h2 fw-bold text-dark mb-0 flex-grow-1" id="productDetailModalLabel" th:text="${productDTO.name}">Product Name</h2>
                                    
                                    <!-- Wishlist Button -->
                                    <div class="d-flex gap-2 flex-shrink-0 z-3 position-relative">
                                        <button type="button" class="btn btn-light rounded-circle shadow-sm wishlist-btn text-muted-custom d-flex align-items-center justify-content-center hover-scale" style="width: 56px; height: 56px;" aria-label="Thêm vào yêu thích">
                                            <i class="bi bi-heart fs-4"></i>
                                        </button>
                                    </div>
                                </div>
                                
                                <div class="d-flex align-items-center gap-3 mb-4 fs-6">
                                    <div style="color: #FACC15;">
                                        <i class="bi bi-star-fill"></i>
                                        <span class="text-dark fw-bold ms-1" th:text="${productDTO.ratingAverage != null ? #numbers.formatDecimal(productDTO.ratingAverage, 1, 1) : '0.0'}">5.0</span>
                                    </div>
                                    <span class="text-muted-custom">|</span>
                                    <span class="text-muted-custom" th:text="'Đã bán ' + (${productDTO.soldCount != null ? productDTO.soldCount : 0})">Đã bán 0</span>
                                </div>
                                
                                <div class="mb-4">
                                    <div class="text-muted-custom text-decoration-line-through fs-5" th:if="${productDTO.effectivePrice < productDTO.basePrice}" th:text="${#numbers.formatDecimal(productDTO.basePrice, 0, 'COMMA', 0, 'POINT')} + '₫'">0₫</div>
                                    <div class="fw-bold text-danger mb-1" style="font-size: 2.5rem; line-height: 1;" th:text="${#numbers.formatDecimal(productDTO.effectivePrice, 0, 'COMMA', 0, 'POINT')} + '₫'">0₫</div>
                                </div>
                                
                                <div class="text-muted-custom text-sm mb-4 line-clamp-3" th:text="${productDTO.description}">
                                    Mô tả sản phẩm
                                </div>
                                
                                <!-- Variants Selection -->
                                <div class="mb-3">
                                    <p class="fw-semibold text-dark mb-2 text-sm">CHỌN PHIÊN BẢN</p>
                                    <select class="form-select form-select-lg mb-3" id="variantSelect" required onchange="document.getElementById('selectedVariantId').value = this.value; filterStoresByVariant(this.value);">
                                        <option value="" disabled selected>-- Chọn Size & Màu --</option>
                                        <option th:each="variant : ${productDTO.variants}" th:value="${variant.id}" th:text="${variant.size} + ' - ' + ${variant.color} + ' (' + ${variant.sku} + ')'">Size - Màu</option>
                                    </select>
                                </div>
                                
                                <!-- Store Availability -->
                                <div class="bg-light rounded-3 p-3 border mb-3">
                                    <p class="fw-semibold text-dark mb-3 text-sm"><i class="bi bi-shop me-2"></i>Chọn cửa hàng (còn hàng)</p>
                                    <select class="form-select mb-3" id="storeSelect" required onchange="document.getElementById('selectedStoreId').value = this.value;">
                                        <option value="" disabled selected>-- Chọn Cửa Hàng --</option>
                                        <!-- Will be populated by JS based on variant -->
                                    </select>
                                </div>
                                
                                <!-- Quantity -->
                                <div class="mb-4">
                                    <p class="fw-semibold text-dark mb-2 text-sm">SỐ LƯỢNG</p>
                                    <div class="d-flex align-items-center gap-2">
                                        <button type="button" class="btn btn-outline-secondary px-3" onclick="let q = document.getElementById('qtyInput'); if(q.value > 1) { q.value--; document.getElementById('selectedQuantity').value = q.value; }">-</button>
                                        <input type="number" id="qtyInput" class="form-control text-center fw-bold" value="1" style="width: 70px;" readonly>
                                        <button type="button" class="btn btn-outline-secondary px-3" onclick="let q = document.getElementById('qtyInput'); q.value++; document.getElementById('selectedQuantity').value = q.value;">+</button>
                                    </div>
                                </div>
                                
                                <div class="mt-auto pt-3">
                                    <button type="submit" id="modalAddToCartSubmitBtn" class="btn btn-primary w-100 rounded-pill py-3 fw-bold fs-5 shadow-sm hover-scale text-white d-flex justify-content-center align-items-center gap-2">
                                        <i class="bi bi-cart-plus"></i> Thêm vào giỏ hàng
                                    </button>
                                </div>
                                
                            </form>
                            
                            <!-- Hidden Data for JS Filtering -->
                            <script th:inline="javascript">
                                /*<![CDATA[*/
                                var storeInventory = /*[[${productDTO.storeAvailability}]]*/ [];
                                function filterStoresByVariant(variantIdStr) {
                                    const variantId = parseInt(variantIdStr);
                                    const storeSelect = document.getElementById('storeSelect');
                                    storeSelect.innerHTML = '<option value="" disabled selected>-- Chọn Cửa Hàng --</option>';
                                    document.getElementById('selectedStoreId').value = '';
                                    
                                    const available = storeInventory.filter(inv => inv.variantId === variantId && inv.quantity > 0);
                                    if (available.length === 0) {
                                        storeSelect.innerHTML = '<option value="" disabled selected>Hết hàng tại tất cả chi nhánh</option>';
                                    } else {
                                        available.forEach(inv => {
                                            const opt = document.createElement('option');
                                            opt.value = inv.storeId;
                                            opt.textContent = inv.storeName + ' (Còn ' + inv.quantity + ')';
                                            storeSelect.appendChild(opt);
                                        });
                                    }
                                }
                                /*]]>*/
                            </script>
                            
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
