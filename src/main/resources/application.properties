# 1. Server Configuration
server.port=8080

# 2. Application Identity
spring.application.name=T-Winkle

# 3. Temporary Security Bypass (For skeleton verification)
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration

# 4. Database Connection
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=T_Winkle;encrypt=true;trustServerCertificate=true;
spring.datasource.username=sa
spring.datasource.password=2006
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# 5. JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true