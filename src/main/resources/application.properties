server.port=5656
server.address=0.0.0.0

spring.application.name=twinkle

# App Configuration
app.base-url=${APP_BASE_URL:http://localhost:5656}

# Database Configuration (SQL Server)
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=T_Winkle;encrypt=true;trustServerCertificate=true;
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.open-in-view=false

# Mail Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_APP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# Persisted avatar upload configuration
app.avatar-directory=${AVATAR_UPLOAD_DIR:uploads/avatars}
twinkle.inventory.low-stock-threshold=5
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
# Banking / VietQR: values supplied by the existing process environment (.env in IntelliJ).
twinkle.payment.bank.bank-id=${BANK_TRANSFER_BANK_ID:BIDV}
twinkle.payment.bank.account-no=${BANK_TRANSFER_ACCOUNT_NO:}
twinkle.payment.bank.account-name=${BANK_TRANSFER_ACCOUNT_NAME:}
twinkle.ai.provider=${AI_PROVIDER:GROQ}
twinkle.ai.groq.api-key=${GROQ_API_KEY:}
twinkle.ai.groq.model=${GROQ_MODEL:openai/gpt-oss-120b}
twinkle.ai.groq.base-url=${GROQ_BASE_URL:https://api.groq.com/openai/v1}
twinkle.ai.groq.connect-timeout=10s
twinkle.ai.groq.read-timeout=45s
twinkle.ai.groq.rate-limit-retries=5
twinkle.ai.rate-limit.per-minute=10
twinkle.ai.rate-limit.per-hour=100
twinkle.ai.max-input-length=2000
