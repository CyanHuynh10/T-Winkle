<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: base('Quên mật khẩu - T-Winkle', ~{::div.forgot-container})}">
<body>
    <!-- Forgot Password Container -->
    <div class="forgot-container container d-flex align-items-center justify-content-center min-vh-100 py-5">
        
        <div class="glass-card p-4 p-md-5 w-100 mx-3 mx-md-auto position-relative z-1" style="max-width: 450px;">
            <!-- Brand -->
            <div class="text-center mb-5">
                <a th:href="@{/}">
                    <img th:src="@{/T-Winkle_LogoNoBG.png}" alt="T-Winkle Logo" height="60" class="mb-3">
                </a>
                <h1 class="h3 fw-bold text-cyan mb-2">Quên mật khẩu</h1>
                <p class="text-muted-custom">Nhập email của bạn để nhận hướng dẫn khôi phục tài khoản.</p>
            </div>
            
            <!-- Forgot Password Form -->
            
            
            
            

            <form th:action="@{/forgot-password}" th:object="${forgotPasswordRequest}" method="post" id="forgotForm" class="needs-validation" novalidate>
                
                <!-- Email Input -->
                <div class="mb-4">
                    <label for="email" class="form-label fw-semibold text-cyan text-sm">Email</label>
                    <div class="position-relative">
                        <i class="bi bi-envelope position-absolute top-50 start-0 translate-middle-y ms-3 text-muted-custom"></i>
                        <input type="email" class="tw-input ps-5" id="email" th:field="*{email}" 
                               placeholder="Nhập email của bạn" required autocomplete="email">
                        <div class="invalid-feedback mt-2">Vui lòng nhập email hợp lệ.</div>
                    </div>
                </div>
                
                <!-- Submit Button -->
                <button type="submit" class="tw-btn tw-btn-primary w-100 fw-bold mb-4" id="forgotSubmitBtn">
                    <span id="forgotBtnText">Gửi yêu cầu</span>
                    <span id="forgotBtnLoader" class="spinner-border spinner-border-sm ms-2 d-none" role="status" aria-hidden="true"></span>
                </button>
                
                <!-- Navigation -->
                <div class="text-center mt-4">
                    <a th:href="@{/login}" class="text-decoration-none text-muted-custom hover-cyan fw-medium text-sm transition-colors d-inline-flex align-items-center">
                        <i class="bi bi-arrow-left me-2"></i> Quay lại đăng nhập
                    </a>
                </div>
                
            </form>
        </div>

        <!-- OTP Modal -->
        <div th:replace="~{fragments/otp_modal :: otp_modal}"></div>

        <!-- Forgot Page Interactions -->
        <script>
            document.addEventListener('DOMContentLoaded', function() {
                const forgotForm = document.getElementById('forgotForm');
                if (forgotForm) {
                    forgotForm.addEventListener('submit', function(event) {
                        if (!forgotForm.checkValidity()) {
                            event.preventDefault();
                            event.stopPropagation();
                            forgotForm.classList.add('was-validated');
                        }
                    });
                }
            });
        </script>

        <!-- Custom Component CSS -->
        <style>
            .was-validated .tw-input:invalid {
                border-color: var(--color-danger);
                background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 12' width='12' height='12' fill='none' stroke='%23EF4444'%3e%3ccircle cx='6' cy='6' r='4.5'/%3e%3cpath stroke-linejoin='round' d='M5.8 3.6h.4L6 6.5z'/%3e%3ccircle cx='6' cy='8.2' r='.6' fill='%23EF4444' stroke='none'/%3e%3c/svg%3e");
                background-repeat: no-repeat;
                background-position: right calc(0.375em + 0.1875rem) center;
                background-size: calc(0.75em + 0.375rem) calc(0.75em + 0.375rem);
            }
            .was-validated .tw-input:invalid:focus {
                box-shadow: 0 0 0 2px rgba(239, 68, 68, 0.2);
            }
            .hover-cyan:hover {
                color: var(--color-primary) !important;
            }
            .transition-colors {
                transition: color 0.2s ease;
            }
        </style>
    </div>
</body>
</html>
