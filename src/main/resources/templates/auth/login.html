<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: base('Đăng nhập - T-Winkle', ~{::div.login-container})}">
<body>
    <div class="login-container container d-flex align-items-center justify-content-center min-vh-100 py-5 position-relative">
        
        <div class="glass-card p-4 p-md-5 w-100" style="max-width: 480px;">
            <!-- Header -->
            <div class="text-center mb-4">
                <a th:href="@{/}">
                    <img th:src="@{/T-Winkle_LogoNoBG.png}" alt="T-Winkle Logo" height="60" class="mb-3">
                </a>
                <h1 class="h3 fw-bold text-cyan mb-1">Chào mừng trở lại</h1>
                <p class="text-muted-custom">One Step - <span class="text-shining">Shining All Day</span></p>
            </div>

            <!-- Login Form -->
            
            
            
            

            <form th:action="@{/login}" method="post" id="loginForm" novalidate>
                
                <!-- Email Input -->
                <div class="mb-3">
                    <label for="email" class="form-label text-sm fw-medium">Địa chỉ Email</label>
                    <input type="email" id="email" name="email" class="tw-input" placeholder="Nhập email của bạn" required autofocus>
                    <div class="invalid-feedback">Vui lòng nhập địa chỉ email hợp lệ.</div>
                </div>

                <!-- Password Input -->
                <div class="mb-3">
                    <div class="d-flex justify-content-between align-items-center">
                        <label for="password" class="form-label text-sm fw-medium mb-0">Mật khẩu</label>
                        <a th:href="@{/forgot-password}" class="text-sm text-cyan text-decoration-none">Quên mật khẩu?</a>
                    </div>
                    
                    <div class="password-field-wrapper position-relative mt-2">
                        <input type="password" id="password" name="password" class="tw-input pe-5" placeholder="Nhập mật khẩu" required autocomplete="current-password">
                        <button type="button" id="togglePasswordBtn" class="password-toggle d-none" aria-label="Hiện mật khẩu">
                            <i id="passwordVisibilityIcon" class="bi bi-eye" aria-hidden="true" style="pointer-events: none;"></i>
                        </button>
                    </div>
                    
                    <div class="invalid-feedback">Vui lòng nhập mật khẩu.</div>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="tw-btn tw-btn-primary w-100 fw-bold mt-4" id="loginSubmitBtn" data-loading-text="Đang đăng nhập...">Đăng nhập
                    
                    
                    
                </button>
            </form>

            <!-- Register Link -->
            <div class="text-center mt-4 pt-3 border-top" style="border-color: var(--color-border) !important;">
                <p class="text-sm text-muted-custom mb-0">Chưa có tài khoản? <a th:href="@{/register}" class="text-cyan text-decoration-none fw-semibold">Đăng ký ngay</a></p>
            </div>
        </div>
        
        <!-- Login Page Interactions -->
        <script>
            document.addEventListener('DOMContentLoaded', function() {
                const passwordInput = document.getElementById('password');
                const togglePasswordBtn = document.getElementById('togglePasswordBtn');
                const passwordVisibilityIcon = document.getElementById('passwordVisibilityIcon');

                if (passwordInput && togglePasswordBtn && passwordVisibilityIcon) {
                    passwordInput.addEventListener('input', function() {
                        if (passwordInput.value.length > 0) {
                            togglePasswordBtn.classList.remove('d-none');
                        } else {
                            passwordInput.type = 'password';
                            passwordVisibilityIcon.className = 'bi bi-eye';
                            togglePasswordBtn.setAttribute('aria-label', 'Hiện mật khẩu');
                            togglePasswordBtn.classList.add('d-none');
                        }
                    });

                    togglePasswordBtn.addEventListener('click', function() {
                        const isHidden = passwordInput.type === 'password';
                        passwordInput.type = isHidden ? 'text' : 'password';
                        passwordVisibilityIcon.className = isHidden ? 'bi bi-eye-slash' : 'bi bi-eye';
                        togglePasswordBtn.setAttribute('aria-label', isHidden ? 'Ẩn mật khẩu' : 'Hiện mật khẩu');
                    });
                }

                const loginForm = document.getElementById('loginForm');
                if (loginForm) {
                    loginForm.addEventListener('submit', function(event) {
                        if (!loginForm.checkValidity()) {
                            event.preventDefault();
                            event.stopPropagation();
                            loginForm.classList.add('was-validated');
                        }
                    });
                }
            });
        </script>

        <!-- Custom Component CSS -->
        <style>
            .was-validated .tw-input:invalid {
                border-color: var(--color-danger);
                background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 12' width='12' height='12' fill='none' stroke='%23EF4444'%3e%3ccircle cx='6' cy='6' r='4.5'/%3e%3cpath stroke-linejoin='round' d='M5.8 3.6h.4L6 6.5z'/%3e%3ccircle cx='6' cy='8.2' r='.6' fill='%23EF4444' stroke='none'/%3e%3c/svg%3e");
                background-repeat: no-repeat;
                background-position: right calc(0.375em + 0.1875rem) center;
                background-size: calc(0.75em + 0.375rem) calc(0.75em + 0.375rem);
            }
            .was-validated .tw-input:invalid:focus {
                box-shadow: 0 0 0 2px rgba(239, 68, 68, 0.2);
            }
            
            .password-toggle {
                position: absolute;
                top: 50%;
                right: 0;
                transform: translateY(-50%);
                z-index: 10;
                border: none;
                background: transparent;
                padding: 0 1rem;
                color: var(--color-text-muted);
                cursor: pointer;
                transition: color 0.2s ease;
            }
            
            .password-toggle:hover,
            .password-toggle:focus {
                color: var(--color-primary);
                outline: none;
            }
            
            .password-toggle:focus-visible {
                box-shadow: 0 0 0 2px rgba(6, 182, 212, 0.5);
                border-radius: var(--radius-md);
            }
        </style>
    </div>
</body>
</html>
