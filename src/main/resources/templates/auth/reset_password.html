<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: base('Đặt lại mật khẩu - T-Winkle', ~{::div.reset-container})}">
<body>
    <!-- Reset Password Container -->
    <div class="reset-container container d-flex align-items-center justify-content-center min-vh-100 py-5">
        
        <div class="glass-card p-4 p-md-5 w-100 mx-3 mx-md-auto position-relative z-1" style="max-width: 450px;">
            <!-- Brand -->
            <div class="text-center mb-5">
                <a th:href="@{/}">
                    <img th:src="@{/T-Winkle_LogoNoBG.png}" alt="T-Winkle Logo" height="60" class="mb-3">
                </a>
                <h1 class="h3 fw-bold text-cyan mb-2">Đặt lại mật khẩu</h1>
                <p class="text-muted-custom">Vui lòng nhập mật khẩu mới cho tài khoản của bạn.</p>
            </div>
            
            <!-- Reset Password Form -->
            <form id="resetForm" class="needs-validation" novalidate>
                
                <!-- New Password Input -->
                <div class="mb-3 position-relative">
                    <label for="password" class="form-label fw-semibold text-cyan text-sm">Mật khẩu mới</label>
                    <div class="position-relative">
                        <i class="bi bi-lock position-absolute top-50 start-0 translate-middle-y ms-3 text-muted-custom"></i>
                        <input type="password" class="tw-input ps-5 pe-5" id="password" name="password" 
                               placeholder="Tối thiểu 6 ký tự" required autocomplete="new-password">
                        <button type="button" id="togglePasswordBtn" class="password-toggle d-none" aria-label="Hiện mật khẩu">
                            <i class="bi bi-eye" id="passwordVisibilityIcon"></i>
                        </button>
                        <div class="invalid-feedback mt-2">Mật khẩu không được để trống.</div>
                    </div>
                </div>
                
                <!-- Confirm New Password Input -->
                <div class="mb-4 position-relative">
                    <label for="confirmPassword" class="form-label fw-semibold text-cyan text-sm">Xác nhận mật khẩu mới</label>
                    <div class="position-relative">
                        <i class="bi bi-shield-lock position-absolute top-50 start-0 translate-middle-y ms-3 text-muted-custom"></i>
                        <input type="password" class="tw-input ps-5 pe-5" id="confirmPassword" name="confirmPassword" 
                               placeholder="Nhập lại mật khẩu mới" required autocomplete="new-password">
                        <button type="button" id="toggleConfirmPasswordBtn" class="password-toggle d-none" aria-label="Hiện mật khẩu">
                            <i class="bi bi-eye" id="confirmPasswordVisibilityIcon"></i>
                        </button>
                        <div class="invalid-feedback mt-2" id="confirmFeedback">Vui lòng xác nhận mật khẩu.</div>
                    </div>
                </div>
                
                <!-- Submit Button -->
                <button type="submit" class="tw-btn tw-btn-primary w-100 fw-bold mb-4" id="resetSubmitBtn">
                    <span id="resetBtnText">Đặt lại mật khẩu</span>
                    <span id="resetBtnLoader" class="spinner-border spinner-border-sm ms-2 d-none" role="status" aria-hidden="true"></span>
                </button>
                
            </form>
        </div>

        <!-- Global Success Notification (Structurally ready for Backend) -->
        <div id="globalToast" class="position-fixed top-0 start-50 translate-middle-x p-3" style="z-index: 1100; transition: opacity 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); opacity: 0; transform: translateY(-20px); pointer-events: none; margin-top: 1rem;">
            <div class="glass-card d-flex align-items-center px-4 py-3 shadow-lg border-0" style="border-left: 4px solid var(--color-success) !important; background: rgba(255,255,255,0.85);">
                <i class="bi bi-check-circle-fill fs-4 me-3" style="color: var(--color-success);"></i>
                <div class="fw-bold fs-6 text-cyan">Mật khẩu đã được đặt lại thành công!</div>
            </div>
        </div>

        <!-- Page Interactions -->
        <script>
            // Safe password toggle setup isolated dynamically
            function setupPasswordToggle(inputId, btnId, iconId) {
                const input = document.getElementById(inputId);
                const btn = document.getElementById(btnId);
                const icon = document.getElementById(iconId);

                if (input && btn && icon) {
                    input.addEventListener('input', function() {
                        if (input.value.length > 0) {
                            btn.classList.remove('d-none');
                        } else {
                            input.type = 'password';
                            icon.className = 'bi bi-eye';
                            btn.setAttribute('aria-label', 'Hiện mật khẩu');
                            btn.classList.add('d-none');
                        }
                    });

                    btn.addEventListener('click', function() {
                        const isHidden = input.type === 'password';
                        input.type = isHidden ? 'text' : 'password';
                        icon.className = isHidden ? 'bi bi-eye-slash' : 'bi bi-eye';
                        btn.setAttribute('aria-label', isHidden ? 'Ẩn mật khẩu' : 'Hiện mật khẩu');
                    });
                }
            }

            document.addEventListener('DOMContentLoaded', function() {
                // Initialize toggles
                setupPasswordToggle('password', 'togglePasswordBtn', 'passwordVisibilityIcon');
                setupPasswordToggle('confirmPassword', 'toggleConfirmPasswordBtn', 'confirmPasswordVisibilityIcon');

                const resetForm = document.getElementById('resetForm');
                const resetSubmitBtn = document.getElementById('resetSubmitBtn');
                const resetBtnText = document.getElementById('resetBtnText');
                const resetBtnLoader = document.getElementById('resetBtnLoader');
                const passwordInput = document.getElementById('password');
                const confirmPasswordInput = document.getElementById('confirmPassword');

                if (resetForm) {
                    resetForm.addEventListener('submit', function(event) {
                        let isValid = true;
                        
                        if (!resetForm.checkValidity()) {
                            isValid = false;
                        }

                        // Enforce custom password match rule
                        if (passwordInput.value !== confirmPasswordInput.value) {
                            confirmPasswordInput.setCustomValidity('Mật khẩu xác nhận không khớp.');
                            isValid = false;
                        } else {
                            confirmPasswordInput.setCustomValidity('');
                        }

                        if (!isValid) {
                            event.preventDefault();
                            event.stopPropagation();
                            resetForm.classList.add('was-validated');
                        } else {
                            event.preventDefault(); // Intercepting for AJAX POST to backend
                            
                            if (!resetSubmitBtn.disabled) {
                                resetSubmitBtn.disabled = true;
                                resetBtnText.textContent = 'Đang đặt lại mật khẩu...';
                                resetBtnLoader.classList.remove('d-none');
                                
                                // PRODUCTION BOUNDARY: Await backend POST /reset-password API.
                                // Upon success, frontend should:
                                // 1. Show #globalToast
                                // 2. setTimeout(() => window.location.href = '/login', 2000);
                            }
                        }
                    });

                    // Clear custom validity dynamically when typing
                    const clearMismatch = function() {
                        if (passwordInput.value === confirmPasswordInput.value && confirmPasswordInput.value !== '') {
                            confirmPasswordInput.setCustomValidity('');
                        } else if (passwordInput.value !== confirmPasswordInput.value && resetForm.classList.contains('was-validated')) {
                            confirmPasswordInput.setCustomValidity('Mật khẩu xác nhận không khớp.');
                        }
                    };
                    
                    passwordInput.addEventListener('input', clearMismatch);
                    confirmPasswordInput.addEventListener('input', clearMismatch);
                }
            });
        </script>

        <!-- Custom Component CSS -->
        <style>
            .was-validated .tw-input:invalid {
                border-color: var(--color-danger);
                background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 12' width='12' height='12' fill='none' stroke='%23EF4444'%3e%3ccircle cx='6' cy='6' r='4.5'/%3e%3cpath stroke-linejoin='round' d='M5.8 3.6h.4L6 6.5z'/%3e%3ccircle cx='6' cy='8.2' r='.6' fill='%23EF4444' stroke='none'/%3e%3c/svg%3e");
                background-repeat: no-repeat;
                /* Adjust background position to leave room for the eye icon */
                background-position: right calc(0.375em + 1.875rem) center;
                background-size: calc(0.75em + 0.375rem) calc(0.75em + 0.375rem);
            }
            .was-validated .tw-input:invalid:focus {
                box-shadow: 0 0 0 2px rgba(239, 68, 68, 0.2);
            }
            .password-toggle {
                position: absolute;
                top: 50%;
                right: 0;
                transform: translateY(-50%);
                z-index: 10;
                border: none;
                background: transparent;
                padding: 0 1rem;
                color: var(--color-text-muted);
                cursor: pointer;
                transition: color 0.2s ease;
            }
            .password-toggle:hover,
            .password-toggle:focus {
                color: var(--color-primary);
                outline: none;
            }
            .password-toggle:focus-visible {
                box-shadow: 0 0 0 2px rgba(6, 182, 212, 0.5);
                border-radius: var(--radius-md);
            }
        </style>
    </div>
</body>
</html>
