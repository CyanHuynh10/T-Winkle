<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
 th:replace="~{fragments/layout :: base('Chat - T-Winkle', ~{::div.chat-page})}">
<body>
<div class="chat-page" style="display: flow-root">
 <div th:replace="~{fragments/navbar :: navbar}"></div>
 <main class="chat-page-main">
  <link rel="stylesheet" href="/chat-assets/chat.css">
  <div id="twinkle-ai-chat-root" class="tw-chat-root" th:attr="data-mode=${chatMode},data-conversation-id=${conversationId},data-start-store-id=${startStoreId}">
   <noscript>Bạn cần bật JavaScript để sử dụng Chat.</noscript>
  </div>
  <script type="module" src="/chat-assets/chat.js"></script>
 </main>
</div>
</body>
</html>
