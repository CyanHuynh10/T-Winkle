<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" th:fragment="base(title, content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">T-Winkle</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/T-Winkle_LogoNoBG.png">

    <!-- Fonts: Inter & JetBrains Mono (Fallback since SVN-Gilroy is missing) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <!-- Bootstrap Foundation -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- T-Winkle Design System -->
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>

    <!-- Mesh Background Foundation -->
    <div class="background-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <!-- Content Injection -->
    <div th:replace="${content}"></div>
    <!-- Global Scroll Clearance for Floating Actions -->
    <div style="height: 100px; width: 100%; pointer-events: none;"></div>

    
    <!-- Chat with AI Floating Button (Guest) -->
    <a sec:authorize="isAnonymous()" th:href="@{/login}" class="btn rounded-circle shadow-lg ai-floating-btn d-flex align-items-center justify-content-center text-decoration-none" aria-label="Chat với AI">✨</a>
    
    <!-- Chat with AI Floating Button (User) -->
    <a sec:authorize="isAuthenticated()" th:href="@{/chat}" class="btn rounded-circle shadow-lg ai-floating-btn d-flex align-items-center justify-content-center text-decoration-none" aria-label="Chat với AI">✨</a>

    <style>
        .ai-floating-btn {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            width: 64px;
            height: 64px;
            z-index: 1040; /* Dưới modal backdrop (1050) và dialog (1055) */
            font-size: 1.75rem;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
            box-shadow: 0 10px 25px rgba(6, 182, 212, 0.2);
            color: transparent; /* Prevents default color text if any */
            text-shadow: 0 0 0 #000; /* For emoji */
        }
        .ai-floating-btn:hover {
            transform: scale(1.05); /* Smooth hover without jittering */
            background: #FFFFFF;
            box-shadow: 0 15px 35px rgba(6, 182, 212, 0.3);
            color: transparent;
        }
        /* Mobile */
        @media (max-width: 767.98px) {
            .ai-floating-btn {
                bottom: 1.5rem;
                right: 1.5rem;
                width: 56px;
                height: 56px;
                font-size: 1.5rem;
            }
        }
    </style>

    <!-- Bootstrap & JS Foundation -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/main.js}"></script>
</body>
</html>
