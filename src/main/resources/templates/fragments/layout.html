<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" th:fragment="base(title, content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">T-Winkle</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/T-Winkle_LogoNoBG.png">

    <!-- Fonts: Inter & JetBrains Mono (Fallback since SVN-Gilroy is missing) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <!-- Bootstrap Foundation -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- T-Winkle Design System -->
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>
    <!-- Global Screen Transition V3 -->
    <style>
        /* Layer 1 + 2: Main Background & Blur */
        #twinkle-global-transition {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 99999;
            background-color: #F8FAFC;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(34,211,238, 0.25), transparent 30%),
                radial-gradient(circle at 85% 30%, rgba(129,140,248, 0.25), transparent 30%),
                radial-gradient(circle at 50% 80%, rgba(253,224,71, 0.2), transparent 40%);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            display: flex;
            justify-content: center;
            align-items: center;
            
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition: opacity 0.3s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        #twinkle-global-transition.is-active {
            opacity: 1 !important;
            visibility: visible !important;
            pointer-events: auto !important;
        }

        /* Layer 3: Loading Container */
        .global-transition-card {
            background: rgba(255, 255, 255, 0.45);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-top: 1px solid rgba(255, 255, 255, 0.8);
            border-left: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 20px;
            box-shadow: 0 16px 48px rgba(0, 0, 0, 0.1);
            aspect-ratio: 16 / 9;
            width: min(30vw, 520px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            position: relative;
            overflow: hidden;
        }
        
        @media (max-width: 1024px) {
            .global-transition-card { width: min(60vw, 400px); }
        }
        @media (max-width: 768px) {
            .global-transition-card { width: 85vw; max-width: none; }
        }

        /* Layer 4: Loading Content */
        .global-transition-logo {
            width: 100px;
            object-fit: contain;
            margin-bottom: 16px;
        }
        @media (max-width: 768px) {
            .global-transition-logo { width: 80px; }
        }

        .global-transition-brand {
            font-family: 'SVN-Gilroy', sans-serif;
            font-weight: 700;
            font-size: 32px;
            color: var(--color-text-base, #1E293B);
            margin-bottom: 24px;
        }
        @media (max-width: 768px) {
            .global-transition-brand { font-size: 26px; }
        }

        .global-transition-loader-track {
            width: 60%;
            height: 6px;
            background: rgba(0, 0, 0, 0.05);
            border-radius: 4px;
            overflow: hidden;
            position: relative;
        }

        .global-transition-loader-fill {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 30%;
            background-color: var(--color-primary, #06B6D4);
            border-radius: 4px;
            animation: slide-fill 1.2s infinite cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes slide-fill {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(350%); }
        }

        @media (prefers-reduced-motion: reduce) {
            .global-transition-loader-fill {
                animation: none !important;
                width: 100%;
                opacity: 0.6;
            }
        }
        
        /* Destination Paint Control */
        body.is-transitioning > *:not(#twinkle-global-transition) {
            opacity: 0 !important;
            pointer-events: none !important;
        }
        .page-heading { text-align: center !important; }
    </style>

    <div id="twinkle-global-transition" class="is-active" aria-hidden="false">
        <div class="global-transition-card">
            <img src="/T-Winkle_LogoNoBG.png" alt="T-Winkle Logo" class="global-transition-logo">
            <div class="global-transition-brand">T-Winkle</div>
            <div class="global-transition-loader-track" aria-hidden="true">
                <div class="global-transition-loader-fill"></div>
            </div>
        </div>
    </div>
    
    <script>
        (function() {
            try {
                var transitionEl = document.getElementById('twinkle-global-transition');
                if (!transitionEl) return;
                
                var intentStr = sessionStorage.getItem('twinkleTransitionIntent');
                var isTransition = false;
                
                if (intentStr) {
                    var intent = JSON.parse(intentStr);
                    var currentPath = window.location.pathname;
                    var isExpired = (Date.now() - intent.timestamp) > 15000;
                    
                    var isHistoryOrReload = false;
                    if (window.performance && window.performance.getEntriesByType) {
                        var navEntries = window.performance.getEntriesByType("navigation");
                        if (navEntries.length > 0) {
                            isHistoryOrReload = navEntries[0].type === "back_forward" || navEntries[0].type === "reload";
                        }
                    } else if (window.performance && window.performance.navigation) {
                        isHistoryOrReload = window.performance.navigation.type === 2 || window.performance.navigation.type === 1;
                    }
                    
                    if (!isExpired && !isHistoryOrReload && intent.sourcePath !== currentPath) {
                        isTransition = true;
                        window.__twinkleTransitionStart = intent.timestamp;
                    }
                    sessionStorage.removeItem('twinkleTransitionIntent');
                }
                
                if (isTransition) {
                    document.body.classList.add('is-transitioning');
                } else {
                    transitionEl.classList.remove('is-active');
                    transitionEl.setAttribute('aria-hidden', 'true');
                    document.body.classList.remove('is-transitioning');
                }
            } catch(e) {
                console.error("Screen Transition Evaluation Error:", e);
                var transitionEl = document.getElementById('twinkle-global-transition');
                if (transitionEl) {
                    transitionEl.classList.remove('is-active');
                    transitionEl.setAttribute('aria-hidden', 'true');
                }
                document.body.classList.remove('is-transitioning');
                sessionStorage.removeItem('twinkleTransitionIntent');
            }
        })();
    </script>

    

    
            
            <style>
                @keyframes loader-slide {
                    0% { left: -40%; width: 40%; }
                    50% { left: 30%; width: 60%; }
                    100% { left: 100%; width: 40%; }
                }
                
                #twinkle-global-loader.is-active {
                    opacity: 1 !important;
                    visibility: visible !important;
                    pointer-events: auto !important;
                }
                
                @media (prefers-reduced-motion: reduce) {
                    .twinkle-loader-bar {
                        animation: none !important;
                        width: 100% !important;
                        left: 0 !important;
                        opacity: 0.6;
                    }
                    #twinkle-global-loader {
                        transition: none !important;
                    }
                }
            </style>
        </div>
    </div>
    
            <style>
                @keyframes pulse {
                    0% { transform: scale(1); opacity: 1; }
                    50% { transform: scale(1.05); opacity: 0.8; }
                    100% { transform: scale(1); opacity: 1; }
                }
                #global-progress-bar.active {
                    display: flex !important;
                }
            </style>
        </div>
    </div>
    
    </div>

    <!-- Shared Toast Notification Container -->
    <div class="toast-container position-fixed top-0 start-50 translate-middle-x p-3" style="z-index: 1150; margin-top: 1rem;" id="toastContainer">
        <!-- Success Toast -->
        <div th:if="${success}" class="toast align-items-center border-0 shadow-lg" role="alert" aria-live="assertive" aria-atomic="true" style="background-color: var(--color-success-bg, #ecfdf5); border-left: 4px solid var(--color-success, #10b981) !important;">
            <div class="d-flex px-2 py-1">
                <div class="toast-body d-flex align-items-center">
                    <i class="bi bi-check-circle-fill me-3 fs-5" style="color: var(--color-success, #10b981);"></i>
                    <span th:text="${success}" class="fw-bold fs-6" style="color: var(--color-success, #10b981);"></span>
                </div>
                <button type="button" class="btn-close me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
        </div>
        
        <!-- Error Toast -->
        <div th:if="${error}" class="toast align-items-center border-0 shadow-lg" role="alert" aria-live="assertive" aria-atomic="true" style="background-color: var(--color-danger-bg, #fef2f2); border-left: 4px solid var(--color-danger, #ef4444) !important;">
            <div class="d-flex px-2 py-1">
                <div class="toast-body d-flex align-items-center">
                    <i class="bi bi-exclamation-circle-fill me-3 fs-5" style="color: var(--color-danger, #ef4444);"></i>
                    <span th:text="${error}" class="fw-bold fs-6" style="color: var(--color-danger, #ef4444);"></span>
                </div>
                <button type="button" class="btn-close me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
        </div>
        <!-- Warning Toast -->
        <div th:if="${warning}" class="toast align-items-center border-0 shadow-lg" role="alert" aria-live="assertive" aria-atomic="true" style="background-color: var(--color-warning-bg, #FEFCE8); border-left: 4px solid var(--color-shining, #FACC15) !important;">
            <div class="d-flex px-2 py-1">
                <div class="toast-body d-flex align-items-center">
                    <i class="bi bi-exclamation-triangle-fill me-3 fs-5" style="color: var(--color-shining, #EAB308);"></i>
                    <span th:text="${warning}" class="fw-bold fs-6" style="color: #CA8A04;"></span>
                </div>
                <button type="button" class="btn-close me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
        </div>

    </div>


    <!-- Mesh Background Foundation -->
    <div class="background-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <!-- Content Injection -->
    <div th:replace="${content}"></div>
    <!-- Global Scroll Clearance for Floating Actions -->
    <div style="height: 100px; width: 100%; pointer-events: none;"></div>

    <th:block th:unless="${isAuthPage}">
        
        <!-- Floating Cart Button -->
        <a th:unless="${isAuthenticated}" th:href="@{/login}" class="btn rounded-circle d-flex align-items-center justify-content-center text-decoration-none floating-cart-btn" aria-label="Giỏ hàng">
            <i class="bi bi-cart3"></i>
            <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger cart-count-badge" style="display: none; font-size: 0.75rem;">0</span>
        </a>
        <a th:if="${isAuthenticated}" th:href="@{/cart}" class="btn rounded-circle d-flex align-items-center justify-content-center text-decoration-none floating-cart-btn" aria-label="Giỏ hàng">
            <i class="bi bi-cart3"></i>
            <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger cart-count-badge" style="display: none; font-size: 0.75rem;">0</span>
        </a>
        
        <!-- Chat with AI Floating Button -->
        <a th:unless="${isAuthenticated}" th:href="@{/login}" class="btn rounded-circle ai-floating-btn d-flex align-items-center justify-content-center text-decoration-none" aria-label="Chat với AI">
            <i class="bi bi-stars"></i>
        </a>
        <a th:if="${isAuthenticated}" th:href="@{/chat}" class="btn rounded-circle ai-floating-btn d-flex align-items-center justify-content-center text-decoration-none" aria-label="Chat với AI">
            <i class="bi bi-stars"></i>
        </a>

        <style>
            .floating-cart-btn, .ai-floating-btn {
                position: fixed;
                right: 2rem;
                width: 64px;
                height: 64px;
                z-index: 1040;
                font-size: 1.75rem;
                background: #FFFFFF;
                border: 1px solid rgba(226, 232, 240, 0.8);
                color: #000000;
                transition: all 0.3s ease;
            }
            .floating-cart-btn {
                bottom: calc(2rem + 64px + 1rem); /* 2rem base + 64px AI btn + 1rem gap */
            }
            .ai-floating-btn {
                bottom: 2rem;
            }
            .floating-cart-btn:hover, .ai-floating-btn:hover {
                transform: scale(1.05);
                background: #FFFFFF;
                color: #06B6D4;
            }
            @media (max-width: 767.98px) {
                .floating-cart-btn, .ai-floating-btn {
                    right: 1.5rem;
                    width: 56px;
                    height: 56px;
                    font-size: 1.5rem;
                }
                .floating-cart-btn {
                    bottom: calc(1.5rem + 56px + 0.75rem);
                }
                .ai-floating-btn {
                    bottom: 1.5rem;
                }
            }
        </style>
    </th:block>

    <!-- Bootstrap & JS Foundation -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/main.js}"></script>
    <script th:src="@{/js/cart-handler.js}"></script>
    <script th:src="@{/js/wishlist-handler.js}"></script>
