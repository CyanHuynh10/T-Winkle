<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
    <th:block th:fragment="navbar">
        <!-- Floating Blocks Wrapper -->
        <!-- On Mobile: Space-between ensures Nav is left, Auth is right -->
        <!-- On Desktop (lg): Center ensures Nav is center, Auth is absolutely positioned to right -->
        <div class="mt-3 mx-2 mx-md-4 z-3 d-flex justify-content-between justify-content-lg-center align-items-stretch position-relative" style="pointer-events: none;">
            
            <!-- CỤM 1 - TOP CENTER (Main Header) -->
            <nav class="navbar navbar-expand-lg header-glass-pill px-2 px-md-4" style="pointer-events: auto; position: relative;">
                <div class="container-fluid px-0 gap-2 gap-lg-3">
                    <!-- Brand -->
                    <a class="navbar-brand d-flex align-items-center" th:href="@{/}">
                        <img th:src="@{/T-Winkle_HeaderNoBG.png}" alt="T-Winkle Logo" height="32" class="logo-img">
                    </a>

                    <!-- Mobile Toggle -->
                    <button class="navbar-toggler border-0 shadow-none text-cyan p-1" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar" aria-controls="mainNavbar" aria-expanded="false" aria-label="Toggle navigation">
                        <i class="bi bi-list fs-3"></i>
                    </button>

                    <!-- Navigation Links -->
                    <div class="collapse navbar-collapse" id="mainNavbar">
                        <ul class="navbar-nav mx-auto mb-2 mb-lg-0 fw-semibold text-sm gap-2 gap-lg-4">
                            <li class="nav-item">
                                <a th:class="${#execInfo.processedTemplateName == 'index' ? 'nav-link text-cyan active' : 'nav-link text-muted-custom hover-cyan transition-colors'}" aria-current="page" th:href="@{/}">Trang chủ</a>
                            </li>
                            <li class="nav-item">
                                <a th:class="${#strings.startsWith(#execInfo.processedTemplateName, 'storefront/product/') ? 'nav-link text-cyan active' : 'nav-link text-muted-custom hover-cyan transition-colors'}" th:href="@{/products}">Sản phẩm</a>
                            </li>
                            <li class="nav-item">
                                <a th:class="${#strings.startsWith(#execInfo.processedTemplateName, 'storefront/store/') ? 'nav-link text-cyan active' : 'nav-link text-muted-custom hover-cyan transition-colors'}" th:href="@{/stores}">Cửa hàng</a>
                            </li>
                        </ul>
                    </div>
                </div>
            </nav>
            
                        <!-- CỤM 2 - TOP RIGHT (Auth Group) -->
            <div class="d-flex align-items-stretch gap-1 gap-md-2 position-lg-absolute top-0 end-0 h-100" style="pointer-events: auto;">
                
                <!-- GUEST STATE -->
                <th:block th:if="${!isAuthenticated}">
                    <a th:href="@{/login}" class="header-glass-pill text-decoration-none text-muted-custom hover-cyan px-3 px-md-4 fw-bold d-flex align-items-center justify-content-center text-sm">
                        Đăng nhập
                    </a>
                    <a th:href="@{/register}" class="header-glass-pill text-decoration-none text-cyan hover-cyan px-3 px-md-4 fw-bold d-flex align-items-center justify-content-center text-sm" style="background: rgba(255, 255, 255, 0.85);">
                        Đăng ký
                    </a>
                </th:block>

                <!-- AUTHENTICATED STATE -->
                <th:block th:if="${isAuthenticated}">
                    <div class="header-glass-pill dropdown d-flex align-items-stretch" style="background: rgba(255, 255, 255, 0.9);">
                        <button class="btn btn-link text-decoration-none d-flex align-items-center gap-2 px-3 hover-cyan transition-colors shadow-none border-0" type="button" id="userDropdown" data-bs-toggle="dropdown" aria-expanded="false" style="color: var(--color-text-main);">
                            <!-- Avatar -->
                            <div class="rounded-circle d-flex align-items-center justify-content-center bg-cyan text-white fw-bold shadow-sm" style="width: 32px; height: 32px; font-size: 0.875rem;">
                                <span class="auth-avatar-initial">U</span>
                            </div>
                            <!-- Username -->
                            <span class="fw-bold text-sm d-none d-md-inline text-dark auth-username" th:text="${currentUsername}">user1</span>
                            <i class="bi bi-chevron-down ms-1 text-muted-custom" style="font-size: 0.75rem;"></i>
                        </button>
                        
                        <ul class="dropdown-menu dropdown-menu-end border border-light shadow-lg rounded-4 mt-2 p-2" aria-labelledby="userDropdown" style="min-width: 220px; background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(24px);">
                            <li class="px-3 py-2 mb-2 border-bottom border-light">
                                <div class="fw-bold text-dark text-truncate auth-username-dropdown" th:text="${currentUsername}">user1</div>
                                <div class="text-xs text-muted-custom">Thành viên T-Winkle</div>
                            </li>
                            <li>
                                <a class="dropdown-item rounded-3 text-sm fw-medium py-2 d-flex align-items-center gap-2" th:href="@{/account}">
                                    <i class="bi bi-person fs-5"></i> Tài khoản
                                </a>
                            </li>
                            <li>
                                <form th:action="@{/logout}" method="post" class="m-0 p-0">
                                    <button type="submit" class="dropdown-item rounded-3 text-sm fw-medium py-2 d-flex align-items-center gap-2 text-danger w-100 text-start">
                                        <i class="bi bi-box-arrow-right fs-5"></i> Đăng xuất
                                    </button>
                                </form>
                            </li>
                        </ul>
                    </div>
                </th:block>

            </div>

        </div>

        <style>
            /* Header Glass Pill Shared Style */
            .header-glass-pill {
                width: max-content;
                max-width: 100%;
                border-radius: 2rem;
                border: 1px solid rgba(255, 255, 255, 0.8);
                box-shadow: 0 12px 32px rgba(0, 0, 0, 0.08), inset 0 1px 2px rgba(255, 255, 255, 0.9);
                backdrop-filter: blur(24px) saturate(150%);
                -webkit-backdrop-filter: blur(24px) saturate(150%);
                background: rgba(255, 255, 255, 0.65);
                transition: all 0.3s ease;
            }
            .header-glass-pill:hover {
                background: rgba(255, 255, 255, 0.85) !important;
                box-shadow: 0 16px 32px rgba(0, 0, 0, 0.1), inset 0 1px 2px rgba(255, 255, 255, 1);
            }

            .nav-link.active {
                color: var(--color-primary) !important;
                font-weight: 700;
            }
            .hover-cyan:hover {
                color: var(--color-primary) !important;
            }
            .transition-colors {
                transition: color 0.2s ease, background-color 0.2s ease;
            }

            /* Responsive Adjustments */
            @media (max-width: 991.98px) {
                .navbar-collapse {
                    background: rgba(255, 255, 255, 0.95);
                    backdrop-filter: blur(24px);
                    -webkit-backdrop-filter: blur(24px);
                    border-radius: 1rem;
                    padding: 1rem;
                    margin-top: 0.75rem;
                    box-shadow: 0 10px 25px rgba(0,0,0,0.05);
                    position: absolute;
                    top: 100%;
                    left: 50%;
                    transform: translateX(-50%);
                    min-width: 200px;
                }
                .logo-img {
                    height: 24px !important; /* Smaller logo on mobile to fit blocks */
                }
                .header-glass-pill {
                    border-radius: 1.5rem; /* Slightly smaller radius on mobile */
                }
            }
            @media (min-width: 992px) {
                .position-lg-absolute {
                    position: absolute !important;
                }
            }
        </style>
    
                        <script>
                            document.addEventListener("DOMContentLoaded", function() {
                                var usernameSpan = document.querySelector(".auth-username");
                                var initialSpan = document.querySelector(".auth-avatar-initial");
                                if (usernameSpan && initialSpan) {
                                    var username = usernameSpan.textContent || usernameSpan.innerText;
                                    if (username && username.length > 0) {
                                        initialSpan.textContent = username.charAt(0).toUpperCase();
                                    }
                                }
                            });
                        </script>
</th:block>
</body>
</html>
