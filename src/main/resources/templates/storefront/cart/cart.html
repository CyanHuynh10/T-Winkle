<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: base('Giỏ hàng - T-Winkle', ~{::div.cart-container})}">
<body>
    <div class="cart-container position-relative">
        <div th:replace="~{fragments/navbar :: navbar}"></div>

        <style>
            .cart-main-card {
                background: rgba(255, 255, 255, 0.85);
                backdrop-filter: blur(28px);
                border: 1px solid rgba(226, 232, 240, 0.8);
                box-shadow: 0 18px 50px rgba(15, 23, 42, 0.08), inset 0 1px 0 rgba(255, 255, 255, 0.9);
                border-radius: 16px;
                padding: 1.5rem;
            }
            .cart-item-row {
                padding-top: 1rem;
                padding-bottom: 1rem;
                border-bottom: 1px solid rgba(226, 232, 240, 0.8);
            }
            .cart-item-row:last-child {
                border-bottom: none;
            }
            .qty-btn {
                width: 32px;
                height: 32px;
                display: flex;
                align-items: center;
                justify-content: center;
                border: 1px solid #E2E8F0;
                background: #FFFFFF;
                color: #0F172A;
                border-radius: 8px;
                transition: all 0.2s ease;
            }
            .qty-btn:hover {
                background: #F8FAFC;
                border-color: #CBD5E1;
            }
            .qty-input {
                width: 40px;
                text-align: center;
                border: none;
                background: transparent;
                font-weight: 600;
                color: #0F172A;
            }
            .qty-input:focus {
                outline: none;
            }
            .store-group-header {
                background: rgba(248, 250, 252, 0.8);
                padding: 0.75rem 1rem;
                border-radius: 12px;
                margin-bottom: 1rem;
                display: flex;
                align-items: center;
                gap: 0.5rem;
                font-weight: 700;
                color: #0F172A;
                border: 1px solid rgba(226, 232, 240, 0.8);
            }
            .item-image {
                width: 80px;
                height: 80px;
                object-fit: cover;
                border-radius: 12px;
                background: #F1F5F9;
                border: 1px solid rgba(226, 232, 240, 0.5);
            }
            @media (max-width: 768px) {
                .item-image {
                    width: 64px;
                    height: 64px;
                }
            }
            .btn-checkout-primary {
                background: #06B6D4;
                color: #FFFFFF;
                box-shadow: 0 8px 20px rgba(6, 182, 212, 0.22);
                transition: all 200ms ease;
                border: none;
            }
            .btn-checkout-primary:hover {
                background: #0891B2;
                box-shadow: 0 10px 24px rgba(6, 182, 212, 0.28);
                color: #FFFFFF;
            }
            .glass-modal {
                background: rgba(255, 255, 255, 0.95);
                backdrop-filter: blur(28px);
                border: 1px solid rgba(226, 232, 240, 0.8);
                box-shadow: 0 24px 60px rgba(15, 23, 42, 0.12);
            }
        </style>

        <main class="pt-3 mt-2 pb-4 position-relative z-1" style="min-height: 80vh;">
            <div class="container max-w-6xl mx-auto px-3 animate-fade-up">
                <div class="mb-4 mb-md-5 mt-md-2">
                    <h1 class="h3 fw-bold text-dark mb-0 page-heading text-center">Giỏ hàng</h1>
                    
                </div>
                
                <!-- Empty State -->
                <div id="cartEmptyState" class="cart-main-card d-flex flex-column align-items-center justify-content-center text-center py-5" style="display: none; min-height: 400px;">
                    <div class="mb-4">
                        <i class="bi bi-cart-x text-muted-custom" style="font-size: 4rem; opacity: 0.4;"></i>
                    </div>
                    <h4 class="fw-bold text-dark mb-3">Giỏ hàng của bạn đang trống</h4>
                    <p class="text-muted-custom mb-4 max-w-md mx-auto">Khám phá các sản phẩm và thêm sản phẩm bạn yêu thích vào giỏ hàng để tiến hành thanh toán.</p>
                    <a th:href="@{/categories}" class="tw-btn btn-checkout-primary rounded-pill px-5 py-3 text-decoration-none fw-bold d-inline-flex align-items-center justify-content-center">
                        Khám phá sản phẩm
                    </a>
                </div>

                <!-- Cart Content -->
                <div id="cartContent" class="row gy-4 justify-content-center" style="display: none;">
                    <div class="col-12" style="max-width: 800px; margin: 0 auto;">
                        <div id="cartGroupsContainer">
                            <!-- JS will render store groups here -->
                        </div>

                        <!-- Pagination -->
                        <div id="cartPaginationContainer" class="d-flex justify-content-center align-items-center gap-2 mt-4">
                        </div>
                        
                        <div class="d-flex justify-content-between mt-4">
                            <a th:href="@{/categories}" class="btn btn-link text-decoration-none text-muted hover-cyan px-0 fw-medium">
                                <i class="bi bi-arrow-left me-2"></i>Tiếp tục mua sắm
                            </a>
                            <button class="btn btn-link text-decoration-none text-danger px-0 fw-medium" onclick="promptClearCart()">
                                <i class="bi bi-trash me-2"></i>Xóa toàn bộ giỏ hàng
                            </button>
                        </div>
                    </div>

                                        <!-- Payment Button -->
                    <div class="col-12 mt-4 text-center">
                        <button id="checkoutBtn" class="tw-btn btn-checkout-primary rounded-pill py-3 px-5 fw-bold fs-5 shadow" onclick="proceedToCheckout()" disabled>
                            Thanh toán
                        </button>
                    </div>
                </div>
            </div>
        </main>

        <!-- Clear Cart Confirmation Modal -->
        <div class="modal fade" id="clearCartModal" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered modal-sm">
                <div class="modal-content glass-modal rounded-4 border-0 text-center p-4">
                    <div class="mb-3 text-danger">
                        <i class="bi bi-exclamation-triangle" style="font-size: 3rem;"></i>
                    </div>
                    <h5 class="fw-bold text-dark mb-2">Xóa giỏ hàng?</h5>
                    <p class="text-muted-custom mb-4 text-sm">Bạn có chắc muốn xóa toàn bộ sản phẩm trong giỏ hàng?</p>
                    <div class="d-flex gap-2 w-100">
                        <button type="button" class="tw-btn btn-profile-cancel rounded-pill py-2 w-50 fw-bold" data-bs-dismiss="modal">Hủy</button>
                        <button type="button" class="tw-btn bg-danger text-white border-0 rounded-pill py-2 w-50 fw-bold shadow-sm" onclick="executeClearCart()">Xóa</button>
                    </div>
                </div>
            </div>
        </div>

        <script>
            let bsClearCartModal;
            
            document.addEventListener('DOMContentLoaded', () => {
                bsClearCartModal = new bootstrap.Modal(document.getElementById('clearCartModal'));
                renderCartPage();
            });

            function formatCurrency(amount) {
                return new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(amount);
            }

            
            
            let cartCurrentPage = 1;

            function renderCartPage() {
                const cart = CartHandler.getCart();
                const emptyState = document.getElementById('cartEmptyState');
                const cartContent = document.getElementById('cartContent');

                if (cart.length === 0) {
                    emptyState.style.setProperty('display', 'flex', 'important');
                    cartContent.style.setProperty('display', 'none', 'important');
                    return;
                }

                emptyState.style.setProperty('display', 'none', 'important');
                cartContent.style.setProperty('display', 'flex', 'important');

                // Group by store
                const groupsMap = {};

                cart.forEach(item => {
                    if (!groupsMap[item.storeId]) {
                        groupsMap[item.storeId] = {
                            storeId: item.storeId,
                            storeName: item.storeName || 'Cửa hàng',
                            items: []
                        };
                    }
                    groupsMap[item.storeId].items.push(item);
                });

                const groupsArray = Object.values(groupsMap);
                const totalPages = Math.ceil(groupsArray.length / 3) || 1;

                if (cartCurrentPage > totalPages) {
                    cartCurrentPage = totalPages;
                }

                const startIndex = (cartCurrentPage - 1) * 3;
                const pageGroups = groupsArray.slice(startIndex, startIndex + 3);

                const groupsContainer = document.getElementById('cartGroupsContainer');
                groupsContainer.innerHTML = '';

                let anySelected = false;
                cart.forEach(item => {
                    if (item.selected !== false) anySelected = true;
                });

                pageGroups.forEach(group => {
                    let groupHtml = `
                        <div class="cart-main-card mb-4" style="padding: 1.25rem;">
                            <div class="store-group-header mb-3" style="background: rgba(248, 250, 252, 0.5); padding: 0.75rem 1rem; border-radius: 12px; display: flex; align-items: center; gap: 0.5rem; font-weight: 700; border: 1px solid rgba(226, 232, 240, 0.6);">
                                <i class="bi bi-shop text-cyan fs-5"></i>
                                <span class="text-dark fs-6">${group.storeName}</span>
                            </div>
                            <div class="store-items">
                    `;

                    group.items.forEach((item, index) => {
                        const isChecked = item.selected !== false ? 'checked' : '';
                        const priceHtml = item.effectivePrice < item.originalPrice ?
                            `<div class="d-flex flex-column align-items-end">
                                <span class="fw-bold text-danger">${formatCurrency(item.effectivePrice)}</span>
                                <span class="text-muted text-decoration-line-through" style="font-size: 0.75rem;">${formatCurrency(item.originalPrice)}</span>
                             </div>` :
                            `<span class="fw-bold text-dark">${formatCurrency(item.effectivePrice)}</span>`;

                        const variantHtml = item.variantName ? 
                            `<span class="badge bg-light text-dark border px-2 py-1 mb-1" style="width: fit-content; align-self: flex-start; white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis;">${item.variantName}</span>` : '';
                            
                        const isLast = index === group.items.length - 1;
                        const borderBottom = isLast ? '' : 'border-bottom: 1px solid rgba(226, 232, 240, 0.6);';

                        groupHtml += `
                            <div class="cart-item-row d-flex gap-3 align-items-center py-3" style="${borderBottom}">
                                <div class="form-check m-0 p-0 d-flex align-items-center">
                                    <input class="form-check-input cursor-pointer shadow-none m-0" type="checkbox" style="width: 1.25rem; height: 1.25rem; border-color: #CBD5E1;" onchange="toggleItemSelect('${item.cartItemId}', this.checked)" ${isChecked}>
                                </div>
                                <img src="${item.image || 'https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&q=80&w=200'}" alt="${item.productName}" class="item-image flex-shrink-0" style="width: 72px; height: 72px; object-fit: cover; border-radius: 10px; border: 1px solid rgba(226, 232, 240, 0.5);">
                                <div class="flex-grow-1 min-w-0 d-flex flex-column justify-content-between h-100">
                                    <div class="d-flex justify-content-between align-items-start gap-2 mb-1">
                                        <h6 class="fw-semibold text-dark mb-0 text-truncate" style="font-size: 0.95rem;">${item.productName}</h6>
                                        <button class="btn btn-link p-0 text-muted hover-cyan shadow-none border-0" onclick="removeItem('${item.cartItemId}')" aria-label="Xóa sản phẩm">
                                            <i class="bi bi-x-lg"></i>
                                        </button>
                                    </div>
                                    ${variantHtml}
                                    <div class="d-flex justify-content-between align-items-end mt-2">
                                        ${priceHtml}
                                        <div class="d-flex align-items-center gap-1 bg-white rounded-2 border" style="padding: 2px;">
                                            <button class="btn btn-sm btn-light border-0 shadow-none d-flex align-items-center justify-content-center" style="width: 24px; height: 24px; padding: 0;" onclick="updateQty('${item.cartItemId}', ${item.quantity - 1})" aria-label="Giảm số lượng">
                                                <i class="bi bi-dash"></i>
                                            </button>
                                            <input type="text" class="text-center border-0 fw-semibold bg-transparent px-1" style="width: 30px; font-size: 0.85rem;" value="${item.quantity}" readonly>
                                            <button class="btn btn-sm btn-light border-0 shadow-none d-flex align-items-center justify-content-center" style="width: 24px; height: 24px; padding: 0;" onclick="updateQty('${item.cartItemId}', ${item.quantity + 1})" aria-label="Tăng số lượng">
                                                <i class="bi bi-plus"></i>
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        `;
                    });

                    groupHtml += `</div></div>`;
                    groupsContainer.innerHTML += groupHtml;
                });

                // Render Pagination
                const pagContainer = document.getElementById('cartPaginationContainer');
                pagContainer.innerHTML = '';
                if (totalPages > 1) {
                    let pagHtml = `<button class="btn btn-outline-secondary btn-sm shadow-none" ${cartCurrentPage === 1 ? 'disabled' : ''} onclick="changeCartPage(${cartCurrentPage - 1})"><i class="bi bi-chevron-left"></i></button>`;
                    for (let i = 1; i <= totalPages; i++) {
                        if (i === cartCurrentPage) {
                            pagHtml += `<button class="btn btn-cyan text-white btn-sm shadow-none fw-bold">${i}</button>`;
                        } else {
                            pagHtml += `<button class="btn btn-outline-secondary btn-sm shadow-none" onclick="changeCartPage(${i})">${i}</button>`;
                        }
                    }
                    pagHtml += `<button class="btn btn-outline-secondary btn-sm shadow-none" ${cartCurrentPage === totalPages ? 'disabled' : ''} onclick="changeCartPage(${cartCurrentPage + 1})"><i class="bi bi-chevron-right"></i></button>`;
                    pagContainer.innerHTML = pagHtml;
                }

                const checkoutBtn = document.getElementById('checkoutBtn');
                if (anySelected) {
                    checkoutBtn.removeAttribute('disabled');
                } else {
                    checkoutBtn.setAttribute('disabled', 'true');
                }
            }

            function changeCartPage(page) {
                cartCurrentPage = page;
                renderCartPage();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }


            function toggleItemSelect(itemId, isSelected) {
                let cart = CartHandler.getCart();
                const item = cart.find(i => i.cartItemId === itemId);
                if (item) {
                    item.selected = isSelected;
                    CartHandler.saveCart(cart);
                }
                renderCartPage();
            }

            function updateQty(id, newQty) {
                if (newQty < 1) return;
                CartHandler.updateQuantity(id, newQty);
                renderCartPage();
            }

            function removeItem(id) {
                CartHandler.removeItem(id);
                renderCartPage();
            }

            function promptClearCart() {
                bsClearCartModal.show();
            }

            function executeClearCart() {
                CartHandler.clearCart();
                bsClearCartModal.hide();
                renderCartPage();
            }

            function proceedToCheckout() {
                // Future phase integration
                window.location.href = '/checkout';
            }
        </script>
    </div>
</body>
</html>
