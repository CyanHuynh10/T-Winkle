<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: base('Đơn hàng của tôi - T-Winkle', ~{::div.order-history-container})}">
<body>
    <div class="order-history-container position-relative">
        <div th:replace="~{fragments/navbar :: navbar}"></div>

        <style>
            .order-card {
                background: rgba(255, 255, 255, 0.85);
                backdrop-filter: blur(28px);
                border: 1px solid rgba(226, 232, 240, 0.8);
                box-shadow: 0 18px 50px rgba(15, 23, 42, 0.08), inset 0 1px 0 rgba(255, 255, 255, 0.9);
                border-radius: 16px;
                padding: 1.5rem;
                height: 100%;
                display: flex;
                flex-direction: column;
                transition: transform 0.2s ease, box-shadow 0.2s ease;
            }
            .order-card:hover {
                transform: translateY(-2px);
                box-shadow: 0 22px 60px rgba(15, 23, 42, 0.12);
            }
        </style>

        <main class="pt-3 mt-2 pb-5 position-relative z-1" style="min-height: 80vh;">
            <div class="container max-w-6xl mx-auto px-3 animate-fade-up">
                
                <div class="mb-4 mb-md-5 mt-md-2">
                    <h1 class="h3 fw-bold text-dark mb-0 page-heading text-center">Đơn hàng</h1>
                </div>
                
                <!-- Empty State -->
                <div id="orderEmptyState" class="order-card align-items-center justify-content-center text-center py-5 mx-auto" style="display: none; min-height: 400px; max-width: 800px;">
                    <div class="mb-4">
                        <i class="bi bi-box-seam text-muted-custom" style="font-size: 4rem; opacity: 0.4;"></i>
                    </div>
                    <h4 class="fw-bold text-dark mb-3">Bạn chưa có đơn hàng</h4>
                    <p class="text-muted-custom mb-4 max-w-md mx-auto">Hãy mua sắm để lấp đầy giỏ hàng và tạo những đơn hàng đầu tiên.</p>
                    <a th:href="@{/categories}" class="tw-btn btn-cyan text-white rounded-pill px-5 py-3 text-decoration-none fw-bold d-inline-flex align-items-center justify-content-center shadow-sm">
                        Khám phá sản phẩm
                    </a>
                </div>

                <!-- Order Grid -->
                <div id="orderGrid" class="row g-4" style="display: none;">
                    <!-- JS will render order cards here -->
                </div>

                <!-- Pagination -->
                <div id="orderPaginationContainer" class="d-flex justify-content-center align-items-center gap-2 mt-5">
                    <!-- JS will render pagination here -->
                </div>

            </div>
        </main>

        <!-- Cancellation Modal -->
        <div class="modal fade" id="cancelOrderModal" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content border-0 shadow-lg rounded-4" style="background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(28px);">
                    <div class="modal-header border-bottom border-light">
                        <h5 class="modal-title fw-bold text-dark">Hủy đơn hàng <span id="cancelOrderIdText" class="text-cyan"></span></h5>
                        <button type="button" class="btn-close shadow-none" data-bs-dismiss="modal" aria-label="Đóng"></button>
                    </div>
                    <div class="modal-body p-4">
                        <p class="text-muted-custom mb-4">Vui lòng chọn lý do hủy đơn hàng:</p>
                        
                        <div class="d-flex flex-column gap-2 mb-3">
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="cancelReason" id="reason1" value="Tôi muốn thay đổi thông tin nhận hàng" checked onchange="toggleCustomReason()">
                                <label class="form-check-label" for="reason1">Tôi muốn thay đổi thông tin nhận hàng</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="cancelReason" id="reason2" value="Tôi muốn thay đổi sản phẩm / số lượng" onchange="toggleCustomReason()">
                                <label class="form-check-label" for="reason2">Tôi muốn thay đổi sản phẩm / số lượng</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="cancelReason" id="reason3" value="Tôi muốn thay đổi phương thức thanh toán" onchange="toggleCustomReason()">
                                <label class="form-check-label" for="reason3">Tôi muốn thay đổi phương thức thanh toán</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="cancelReason" id="reason4" value="Tôi không còn nhu cầu mua" onchange="toggleCustomReason()">
                                <label class="form-check-label" for="reason4">Tôi không còn nhu cầu mua</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="cancelReason" id="reason5" value="Tìm được sản phẩm phù hợp hơn" onchange="toggleCustomReason()">
                                <label class="form-check-label" for="reason5">Tìm được sản phẩm phù hợp hơn</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="cancelReason" id="reason6" value="Thời gian giao hàng không phù hợp" onchange="toggleCustomReason()">
                                <label class="form-check-label" for="reason6">Thời gian giao hàng không phù hợp</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="cancelReason" id="reason7" value="Khác" onchange="toggleCustomReason()">
                                <label class="form-check-label" for="reason7">Khác</label>
                            </div>
                        </div>

                        <textarea id="customReasonInput" class="form-control rounded-3 shadow-none border-light bg-light" rows="3" placeholder="Vui lòng nhập lý do (Bắt buộc)..." style="display: none;"></textarea>
                    </div>
                    <div class="modal-footer border-top border-light p-3">
                        <button type="button" class="btn btn-light rounded-pill px-4" data-bs-dismiss="modal">Đóng</button>
                        <button type="button" class="btn btn-danger rounded-pill px-4 shadow-sm" onclick="submitCancellation()">Gửi yêu cầu hủy</button>
                    </div>
                </div>
            </div>
        </div>

        <script src="/js/order-handler.js"></script>
        <script>
            let currentOrderPage = 1;
            const ORDERS_PER_PAGE = 9;
            let cancelModalInstance;
            let orderToCancel = null;

            document.addEventListener('DOMContentLoaded', () => {
                if (typeof bootstrap !== 'undefined') {
                    const modalEl = document.getElementById('cancelOrderModal');
                    if (modalEl) cancelModalInstance = new bootstrap.Modal(modalEl);
                }
                renderOrderHistory();
            });

            function renderOrderHistory() {
                const orders = OrderHandler.getOrders();
                const emptyState = document.getElementById('orderEmptyState');
                const grid = document.getElementById('orderGrid');
                const pagContainer = document.getElementById('orderPaginationContainer');

                if (orders.length === 0) {
                    emptyState.style.setProperty('display', 'flex', 'important');
                    grid.style.setProperty('display', 'none', 'important');
                    pagContainer.innerHTML = '';
                    return;
                }

                emptyState.style.setProperty('display', 'none', 'important');
                grid.style.setProperty('display', 'flex', 'important');

                const totalPages = Math.ceil(orders.length / ORDERS_PER_PAGE) || 1;
                if (currentOrderPage > totalPages) {
                    currentOrderPage = totalPages;
                }

                const startIndex = (currentOrderPage - 1) * ORDERS_PER_PAGE;
                const pageOrders = orders.slice(startIndex, startIndex + ORDERS_PER_PAGE);

                let html = '';
                pageOrders.forEach(order => {
                    const statusInfo = OrderHandler.getStatusSemantics(order.status);
                    
                    let statusBadgeHtml = \`<span class="badge bg-\${statusInfo.color} bg-opacity-10 text-\${statusInfo.color} px-2 py-1 border border-\${statusInfo.color} border-opacity-25 rounded-pill"><i class="bi \${statusInfo.icon} me-1"></i>\${statusInfo.text}</span>\`;
                    
                    let cancelPendingHtml = '';
                    if (order.cancellationRequest && order.cancellationRequest.status === 'PENDING_STORE_CONFIRMATION') {
                        cancelPendingHtml = \`<div class="text-warning text-sm fw-medium mt-2"><i class="bi bi-info-circle me-1"></i>Đang chờ cửa hàng xác nhận hủy</div>\`;
                    }

                    let cancelActionHtml = '';
                    if (order.status === 'Chờ xác nhận' && !order.cancellationRequest) {
                        cancelActionHtml = \`<button class="btn btn-outline-danger btn-sm rounded-pill flex-grow-1" onclick="openCancelModal('\${order.orderId}')">Hủy đơn</button>\`;
                    }

                    const totalQty = order.items.reduce((sum, item) => sum + item.quantity, 0);

                    html += \`
                        <div class="col-12 col-md-6 col-lg-4">
                            <div class="order-card">
                                <div class="d-flex justify-content-between align-items-start mb-3">
                                    <div>
                                        <div class="fw-bold text-dark fs-5">\${order.orderId}</div>
                                        <div class="text-muted text-sm mt-1">\${OrderHandler.formatDate(order.createdAt)}</div>
                                    </div>
                                </div>
                                <div class="mb-4">
                                    \${statusBadgeHtml}
                                    \${cancelPendingHtml}
                                </div>
                                <div class="mt-auto pt-3 border-top border-light">
                                    <div class="d-flex justify-content-between align-items-center mb-1">
                                        <span class="text-muted-custom">Tổng sản phẩm</span>
                                        <span class="fw-semibold text-dark">\${totalQty}</span>
                                    </div>
                                    <div class="d-flex justify-content-between align-items-center mb-4">
                                        <span class="text-muted-custom">Tổng tiền</span>
                                        <span class="fw-bold text-cyan fs-5">\${OrderHandler.formatCurrency(order.total)}</span>
                                    </div>
                                    <div class="d-flex gap-2">
                                        <a href="/orders/\${order.orderId}" class="btn btn-light text-dark rounded-pill flex-grow-1 fw-medium border shadow-sm">Xem chi tiết</a>
                                        \${cancelActionHtml}
                                    </div>
                                </div>
                            </div>
                        </div>
                    \`;
                });

                grid.innerHTML = html;

                pagContainer.innerHTML = '';
                if (totalPages > 1) {
                    let pagHtml = \`<button class="btn btn-outline-secondary btn-sm shadow-none" \${currentOrderPage === 1 ? 'disabled' : ''} onclick="changeOrderPage(\${currentOrderPage - 1})"><i class="bi bi-chevron-left"></i></button>\`;
                    for (let i = 1; i <= totalPages; i++) {
                        if (i === currentOrderPage) {
                            pagHtml += \`<button class="btn btn-cyan text-white btn-sm shadow-none fw-bold">\${i}</button>\`;
                        } else {
                            pagHtml += \`<button class="btn btn-outline-secondary btn-sm shadow-none" onclick="changeOrderPage(\${i})">\${i}</button>\`;
                        }
                    }
                    pagHtml += \`<button class="btn btn-outline-secondary btn-sm shadow-none" \${currentOrderPage === totalPages ? 'disabled' : ''} onclick="changeOrderPage(\${currentOrderPage + 1})"><i class="bi bi-chevron-right"></i></button>\`;
                    pagContainer.innerHTML = pagHtml;
                }
            }

            function changeOrderPage(page) {
                currentOrderPage = page;
                renderOrderHistory();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }

            function openCancelModal(orderId) {
                orderToCancel = orderId;
                document.getElementById('cancelOrderIdText').textContent = orderId;
                
                // Reset form
                document.getElementById('reason1').checked = true;
                toggleCustomReason();
                document.getElementById('customReasonInput').value = '';

                if (cancelModalInstance) cancelModalInstance.show();
            }

            function toggleCustomReason() {
                const isOther = document.getElementById('reason7').checked;
                const customInput = document.getElementById('customReasonInput');
                customInput.style.display = isOther ? 'block' : 'none';
            }

            function submitCancellation() {
                if (!orderToCancel) return;

                const selectedReasonEl = document.querySelector('input[name="cancelReason"]:checked');
                const reason = selectedReasonEl ? selectedReasonEl.value : '';
                
                let customReason = '';
                if (reason === 'Khác') {
                    customReason = document.getElementById('customReasonInput').value.trim();
                    if (!customReason) {
                        alert('Vui lòng nhập lý do cụ thể.');
                        return;
                    }
                }

                const success = OrderHandler.requestCancellation(orderToCancel, reason, customReason);
                
                if (success) {
                    if (cancelModalInstance) cancelModalInstance.hide();
                    if (window.showToast) {
                        window.showToast('Gửi yêu cầu hủy đơn thành công', 'success');
                    } else {
                        alert('Gửi yêu cầu hủy đơn thành công');
                    }
                    renderOrderHistory();
                } else {
                    alert('Không thể hủy đơn hàng này.');
                }
            }
        </script>
    </div>
</body>
</html>
