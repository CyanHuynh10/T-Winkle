<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: base('Theo dõi đơn hàng - T-Winkle', ~{::div.order-tracking-container})}"><body>
<div class="order-tracking-container position-relative"><div th:replace="~{fragments/navbar :: navbar}"></div>
<main class="storefront-page-main pb-5"><div class="container max-w-6xl mx-auto px-3">
<h1 class="h3 fw-bold text-dark text-center storefront-page-title" id="trackingHeading">Theo dõi đơn hàng</h1>
<a th:href="@{/orders/{id}(id=${order.id})}" class="tw-back-link">← Quay lại chi tiết đơn hàng</a>
<div class="tracking-card mx-auto" style="max-width:800px" id="trackingContent">
<header class="text-center border-bottom pb-4"><h2 class="h5 fw-bold" id="trkOrderId" th:text="${order.orderCode}"></h2>
<p class="text-muted text-sm" id="trkDate" th:text="${#temporals.format(order.createdAt,'dd/MM/yyyy HH:mm')}"></p>
<span class="badge rounded-pill px-3 py-2 tracking-status" id="trkStatusBadge" th:classappend="${order.status == 'Chờ xác nhận' ? 'waiting' : order.status == 'Đã giao' ? 'delivered' : order.status == 'Đã hủy' ? 'cancelled' : 'confirmed'}" th:text="${order.status}"></span>
<p th:if="${pendingCancellation}" id="trkPendingCancel" class="pending-cancellation rounded-3 p-3 mt-3 mb-0">Đang chờ cửa hàng xác nhận hủy</p></header>
<div class="tracking-stream" id="timelineContainer" aria-label="Lịch sử đơn hàng">
<article th:each="stage : ${trackingStages}" class="tracking-step" th:classappend="${stage.color + (stage.current ? ' current' : '')}" th:data-completed="${stage.completed}" th:data-status="${stage.status}">
<div class="tracking-indicator" aria-hidden="true"><i class="bi" th:classappend="${!stage.completed ? 'bi-circle' : stage.status == 'Đã hủy' ? 'bi-x-lg' : stage.status == 'Chờ xác nhận' and stage.current ? 'bi-clock' : 'bi-check-lg'}"></i></div>
<div><h2 class="fw-bold mb-1" th:text="${stage.status}"></h2><time th:if="${stage.createdAt != null}" class="text-muted text-sm" th:datetime="${stage.createdAt}" th:text="${#temporals.format(stage.createdAt,'dd/MM/yyyy HH:mm:ss')}"></time>
<p class="tracking-description text-muted text-sm" th:text="${stage.note != null and !#strings.isEmpty(stage.note) ? stage.note : stage.completed ? (stage.status == 'Chờ xác nhận' ? 'Đơn hàng đã được tạo và đang chờ xác nhận.' : stage.status == 'Đã xác nhận' ? 'Cửa hàng đã xác nhận đơn hàng.' : stage.status == 'Đã giao' ? 'Đơn hàng đã được giao thành công.' : 'Đơn hàng đã hủy.') : 'Chưa diễn ra'}"></p></div></article>
</div>

</div></div></main></div></body></html>
