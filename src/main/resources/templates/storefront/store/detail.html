<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: base('Chi tiết Cửa hàng - T-Winkle', ~{::div.storefront-container})}">
<body>
    <div class="storefront-container position-relative">
        <div th:replace="~{fragments/navbar :: navbar}"></div>

        <main class="pt-4 mt-2 pb-5 position-relative z-1 storefront-page-main" style="min-height: 80vh;">
            <div class="container animate-fade-up">

                <!-- Store Header Card -->
                <div class="glass-card rounded-4 border border-light shadow-sm bg-white p-4 p-md-5 mb-5 d-flex flex-column flex-md-row gap-4 gap-md-5 align-items-center align-items-md-start position-relative overflow-hidden">
                    
                    <div class="store-image flex-shrink-0 bg-light rounded-4 overflow-hidden position-relative border shadow-sm" style="width: 160px; height: 160px; display: flex; align-items: center; justify-content: center;">
                        <img th:if="${store.imageUrl != null}" th:src="${store.imageUrl}" th:alt="${store.name}" class="w-100 h-100 object-fit-cover">
                        <i th:unless="${store.imageUrl != null}" class="bi bi-shop text-muted opacity-25" style="font-size: 5rem;"></i>
                    </div>

                    <div class="store-info flex-grow-1 text-center text-md-start w-100 position-relative z-1">
                        <div class="d-flex flex-column flex-md-row justify-content-between align-items-center align-items-md-start mb-3 gap-3">
                            <div>
                                <h1 class="h3 fw-bold text-dark mb-2 storefront-page-title" th:text="${store.name}">Store Name</h1>
                                <a th:href="@{/stores}" class="tw-back-link">← Quay lại danh sách cửa hàng</a>
                                <span th:if="${store.status == 'OPEN'}" class="badge bg-success bg-opacity-10 text-success px-2 py-1 fs-6 border border-success border-opacity-10"><i class="bi bi-door-open me-1"></i> Đang mở</span><span th:if="${store.status == 'CLOSED'}" class="badge bg-danger bg-opacity-10 text-danger px-2 py-1 fs-6 border border-danger border-opacity-10"><i class="bi bi-door-closed me-1"></i> Đã đóng</span>
                            </div>
                            <div class="d-flex flex-column align-items-center align-items-md-end">
                                <div class="d-flex align-items-center gap-1" style="color: #FACC15; font-size: 1.25rem;">
                                    <i class="bi bi-star-fill"></i>
                                    <span class="text-dark fw-bold ms-1" th:text="${store.ratingAverage}"></span>
                                </div>
                                <span class="text-muted-custom text-sm" th:text="${store.reviewCount} + ' đánh giá'"></span>
                            </div>
                        </div>

                        <p class="text-muted-custom d-flex align-items-start gap-2 justify-content-center justify-content-md-start mb-2">
                            <i class="bi bi-geo-alt-fill text-cyan mt-1"></i>
                            <span th:text="${store.addressLine + ', ' + (store.ward != null ? store.ward + ', ' : '') + (store.district != null ? store.district + ', ' : '') + store.city}"></span>
                        </p>
                        <p class="text-muted-custom d-flex align-items-center gap-2 justify-content-center justify-content-md-start mb-4">
                            <i class="bi bi-telephone-fill text-cyan"></i>
                            <span th:text="${store.phone}"></span>
                        </p>

                        <div class="d-flex flex-wrap gap-3 justify-content-center justify-content-md-start mt-2">
                            <a th:href="@{/chat/start/{id}(id=${store.id})}" class="tw-btn tw-btn-primary rounded-pill px-4 py-2 text-decoration-none d-flex align-items-center gap-2 shadow-sm hover-lift">
                                <i class="bi bi-chat-dots-fill"></i> Chat với cửa hàng
                            </a>
                            
                            <!-- Store Catalog Button -->
                            <a th:href="@{/stores/{slug}/catagories(slug=${store.slug})}" class="tw-btn control-btn bg-white border shadow-sm rounded-pill px-4 py-2 text-decoration-none d-flex align-items-center gap-2 text-dark fw-bold hover-cyan">
                                <i class="bi bi-bag"></i> Sản phẩm tại cửa hàng
                            </a>
                        </div>
                    </div>
                </div>

                
            </div>
        </main>
    </div>

    <!-- Scripts and Styles -->
    <style>
        .control-btn {
            border: 1px solid transparent !important;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05) !important;
            transition: all 0.2s ease;
            outline: none !important;
            color: var(--color-text-main);
        }
        .control-btn:hover {
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08) !important;
            transform: translateY(-1px);
            color: var(--color-cyan, #0891B2);
        }
        
        
        
    </style>
    
</body>
</html>
