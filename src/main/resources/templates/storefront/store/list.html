<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: base('Cửa hàng - T-Winkle', ~{::div.storefront-container})}">
<body>
    <div class="storefront-container position-relative">
        <!-- Navbar Fragment -->
        <div th:replace="~{fragments/navbar :: navbar}"></div>

        <main class="pt-4 mt-2 pb-5 position-relative z-1 storefront-page-main" style="min-height: 80vh;">
            
            <!-- Page Heading & Search Bar -->
            <section class="container mb-4 mb-md-5 pt-4 storefront-heading-section">
                <div class="max-w-4xl mx-auto text-center px-3 animate-fade-up">
                    <h1 class="h3 fw-bold text-dark mb-4">Khám phá cửa hàng T-Winkle</h1>
                    
                    <!-- Search Input Wrapper (Glassmorphism) -->
                    <form th:action="@{/stores}" method="get" class="glass-search-wrapper p-2 rounded-pill mx-auto position-relative" style="max-width: 680px; background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.9); box-shadow: 0 10px 30px rgba(0,0,0,0.05); transition: all 0.3s ease;">
                        <div class="d-flex align-items-center bg-white rounded-pill pe-2 ps-4 py-2 position-relative z-1" style="box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);">
                            <i class="bi bi-search fs-5 text-muted-custom"></i>
                            <input type="text" id="storeSearchInput" name="keyword" th:value="${keyword}" class="form-control border-0 bg-transparent shadow-none fs-5 ms-2 py-2" placeholder="Tìm cửa hàng theo tên, địa chỉ..." aria-label="Tìm kiếm cửa hàng" autocomplete="off">
                            <button type="button" id="clearStoreSearchBtn" class="btn btn-link text-muted-custom text-decoration-none d-none hover-cyan" aria-label="Xóa tìm kiếm">
                                <i class="bi bi-x-circle-fill fs-5"></i>
                            </button>
                            <button class="btn btn-primary rounded-circle shadow-sm d-flex align-items-center justify-content-center ms-2" style="width: 44px; height: 44px; flex-shrink: 0;" aria-label="Tìm kiếm">
                                <i class="bi bi-search fs-5"></i>
                            </button>
                        </div>
                    </form>
                </div>
            </section>

            <!-- Store Collection -->
            <section class="container pb-5">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2 class="h5 fw-bold text-dark mb-0">Hệ thống cửa hàng</h2>
                    <span class="text-muted-custom text-sm" th:text="${totalStoreCount} + ' cửa hàng'">0 cửa hàng</span>
                </div>

                <!-- Empty State (Hidden initially) -->
                <div th:if="${#lists.isEmpty(stores)}" id="storeEmptyState" class="glass-card bg-white border shadow-sm rounded-4 p-5 text-center mx-auto" style="max-width:800px;min-height:400px;"><i class="bi bi-shop text-muted-custom d-block mb-4" style="font-size:4rem;opacity:.4"></i><h2 class="h4 fw-bold">Không tìm thấy cửa hàng phù hợp</h2><p class="text-muted-custom">Hãy thử tên hoặc địa chỉ khác để tìm cửa hàng T-Winkle.</p></div>

                <!-- Grid -->
                
                <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4 animate-fade-up position-relative" style="animation-delay: 0.2s;" id="storeGridList">
                    <div class="col" th:each="store : ${stores}">
                        <div tabindex="0" role="button" th:aria-label="'Xem chi tiết ' + ${store.name}" style="cursor: pointer;" class="glass-card h-100 p-3 pb-4 d-flex flex-column rounded-4 border shadow-sm bg-white position-relative store-card" data-bs-toggle="modal" data-bs-target="#storeDetailModal" th:data-store-id="${store.id}" th:data-store-slug="${store.slug}" th:data-store-name="${store.name}" th:data-store-status="${store.status == 'OPEN' ? 'Đang mở' : 'Đã đóng'}" th:data-store-address="${store.addressLine + ', ' + (store.ward != null ? store.ward + ', ' : '') + (store.district != null ? store.district + ', ' : '') + store.city}" th:data-store-rating="${store.ratingAverage}" th:data-store-reviews="${store.reviewCount + ' đánh giá'}" th:data-store-phone="${store.phone}" th:data-store-image="${store.imageUrl}" th:data-store-status-color="${store.status == 'OPEN' ? 'success' : 'danger'}">
                            <div class="store-img-wrapper bg-light rounded-3 mb-3 overflow-hidden position-relative" style="aspect-ratio: 16/9; display: flex; align-items: center; justify-content: center;">
                                <img th:if="${store.imageUrl != null and !store.imageUrl.isEmpty()}" th:src="${store.imageUrl}" alt="Store Image" class="w-100 h-100 object-fit-cover">
                                <i th:unless="${store.imageUrl != null and !store.imageUrl.isEmpty()}" class="bi bi-shop text-muted opacity-25" style="font-size: 4rem;"></i>
                                <span th:if="${store.status == 'OPEN'}" class="position-absolute top-0 start-0 m-2 badge bg-success bg-opacity-10 text-success px-2 py-1 border border-success border-opacity-10 shadow-sm" style="backdrop-filter: blur(4px);"><i class="bi bi-door-open me-1"></i> Đang mở</span>
                                <span th:unless="${store.status == 'OPEN'}" class="position-absolute top-0 start-0 m-2 badge bg-danger bg-opacity-10 text-danger px-2 py-1 border border-danger border-opacity-10 shadow-sm" style="backdrop-filter: blur(4px);"><i class="bi bi-door-closed me-1"></i> Đã đóng</span>
                            </div>
                            <div class="d-flex flex-column flex-grow-1">
                                <h3 class="h5 fw-bold text-dark mb-2 store-name transition-colors" th:text="${store.name}">Store Name</h3>
                                <p class="text-muted-custom text-sm mb-3 d-flex align-items-start gap-2">
                                    <i class="bi bi-geo-alt-fill text-cyan mt-1"></i>
                                    <span th:text="${store.addressLine + ', ' + (store.ward != null ? store.ward + ', ' : '') + (store.district != null ? store.district + ', ' : '') + store.city}">Address</span>
                                </p>
                                <div class="d-flex align-items-center gap-2 mb-4 text-sm">
                                    <div style="color: #FACC15;">
                                        <i class="bi bi-star-fill"></i>
                                        <span class="text-dark fw-bold ms-1" th:text="${store.ratingAverage != null ? #numbers.formatDecimal(store.ratingAverage, 1, 1) : '0.0'}">0.0</span>
                                    </div>
                                    <span class="text-muted-custom">|</span>
                                    <span class="text-muted-custom" th:text="${store.reviewCount != null ? store.reviewCount + ' đánh giá' : '0 đánh giá'}">0 đánh giá</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <style>
                    .store-card {
                        transition: all 0.3s ease;
                        border-color: rgba(255,255,255,0.8) !important;
                    }
                    .store-card:hover {
                        border-color: rgba(6, 182, 212, 0.3) !important;
                        box-shadow: 0 10px 30px rgba(6, 182, 212, 0.08) !important;
                        transform: translateY(-4px);
                    }
                    .store-card:hover .store-name {
                        color: var(--color-cyan, #0891B2) !important;
                    }
                </style>
                <script>
                    document.addEventListener('DOMContentLoaded', () => {
                        const input = document.getElementById('storeSearchInput');
                        const clear = document.getElementById('clearStoreSearchBtn');
                        const sync = () => clear.classList.toggle('d-none', !input.value);
                        input.addEventListener('input', sync); sync();
                        clear.addEventListener('click', () => { input.value = ''; input.form.requestSubmit(); });
                    });
                </script>
            </section>
        </main>
<!-- Store Detail Modal -->
    <div class="modal fade" id="storeDetailModal" tabindex="-1" aria-labelledby="storeDetailModalLabel" aria-hidden="true" aria-modal="true" role="dialog">
        <div class="modal-dialog modal-dialog-centered modal-xl modal-16-9">
            <div class="modal-content border border-light shadow-lg d-flex flex-column" style="background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(28px); border-radius: 1.5rem; overflow: hidden; max-height: 90vh;">
                <button type="button" class="btn-close position-absolute top-0 end-0 m-3 m-md-4 z-3 bg-white rounded-circle shadow-sm p-2" data-bs-dismiss="modal" aria-label="Đóng chi tiết cửa hàng"></button>
                
                <div class="modal-body p-4 p-md-5 d-flex flex-column flex-grow-1 overflow-auto custom-scrollbar">
                    
                    <div class="d-flex flex-column flex-md-row gap-4 gap-md-5 align-items-center align-items-md-start position-relative h-100">
                        <div class="store-image flex-shrink-0 bg-light rounded-4 overflow-hidden position-relative border shadow-sm" style="width: 160px; height: 160px; display: flex; align-items: center; justify-content: center;">
                            <i class="bi bi-shop text-muted opacity-25" style="font-size: 5rem;"></i>
                        </div>

                        <div class="store-info flex-grow-1 text-center text-md-start w-100 position-relative z-1 d-flex flex-column justify-content-center h-100">
                            <div class="d-flex flex-column flex-md-row justify-content-between align-items-center align-items-md-start mb-3 gap-3">
                                <div>
                                    <h1 class="h3 fw-bold text-dark mb-2" id="modalStoreName">Store Name</h1>
                                    <span class="badge px-2 py-1 fs-6 border shadow-sm" id="modalStoreStatusBadge" style="backdrop-filter: blur(4px);">
                                        <i class="bi bi-door-open me-1" id="modalStoreStatusIcon"></i> <span id="modalStoreStatusText">Status</span>
                                    </span>
                                </div>
                                <div class="d-flex flex-column align-items-center align-items-md-end">
                                    <div class="d-flex align-items-center gap-1" style="color: #FACC15; font-size: 1.25rem;">
                                        <i class="bi bi-star-fill"></i>
                                        <span class="text-dark fw-bold ms-1" id="modalStoreRating">4.9</span>
                                    </div>
                                    <span class="text-muted-custom text-sm" id="modalStoreReviews">2.4k đánh giá</span>
                                </div>
                            </div>

                            <p class="text-muted-custom d-flex align-items-start gap-2 justify-content-center justify-content-md-start mb-2">
                                <i class="bi bi-geo-alt-fill text-cyan mt-1"></i>
                                <span id="modalStoreAddress">Address</span>
                            </p>
                            <p class="text-muted-custom d-flex align-items-center gap-2 justify-content-center justify-content-md-start mb-4">
                                <i class="bi bi-telephone-fill text-cyan"></i>
                                <span id="modalStorePhone">Phone</span>
                            </p>

                            <div class="d-flex flex-wrap gap-3 justify-content-center justify-content-md-start mt-2 mt-md-auto pb-md-2">
                                <a href="/chat" id="modalStoreChatBtn" class="tw-btn tw-btn-primary rounded-pill px-4 py-2 text-decoration-none d-flex align-items-center gap-2 shadow-sm hover-lift">
                                    <i class="bi bi-chat-dots-fill"></i> Chat với cửa hàng
                                </a>
                                <a href="#" id="modalStoreCatalogBtn" class="tw-btn control-btn bg-white border shadow-sm rounded-pill px-4 py-2 text-decoration-none d-flex align-items-center gap-2 text-dark fw-bold hover-cyan">
                                    <i class="bi bi-bag"></i> Sản phẩm tại cửa hàng
                                </a>
                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>
    
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const storeCards = document.querySelectorAll('.store-card');
            
            storeCards.forEach(card => {
                // Keyboard accessibility for store cards
                card.addEventListener('keydown', function(e) {
                    if (e.key === 'Enter' || e.key === ' ') {
                        e.preventDefault();
                        card.click();
                    }
                });
                
                card.addEventListener('click', function() {
                    const slug = this.getAttribute('data-store-slug');
                    document.getElementById('modalStoreChatBtn').href = '/chat/start/' + this.dataset.storeId;
                    const name = this.getAttribute('data-store-name');
                    const status = this.getAttribute('data-store-status');
                    const address = this.getAttribute('data-store-address');
                    const rating = this.getAttribute('data-store-rating');
                    const reviews = this.getAttribute('data-store-reviews');
                    const phone = this.getAttribute('data-store-phone');
                    const color = this.getAttribute('data-store-status-color');
                    
                    document.getElementById('modalStoreName').textContent = name;
                    document.getElementById('modalStoreStatusText').textContent = status;
                    document.getElementById('modalStoreAddress').textContent = address;
                    document.getElementById('modalStoreRating').textContent = rating;
                    document.getElementById('modalStoreReviews').textContent = reviews;
                    document.getElementById('modalStorePhone').textContent = phone || 'Chưa cập nhật';
                    const imagePanel = document.querySelector('#storeDetailModal .store-image');
                    imagePanel.replaceChildren();
                    if (this.dataset.storeImage) {
                        const image = document.createElement('img'); image.src = this.dataset.storeImage;
                        image.alt = name; image.className = 'w-100 h-100 object-fit-cover'; imagePanel.appendChild(image);
                    } else {
                        const icon = document.createElement('i'); icon.className = 'bi bi-shop text-muted opacity-25';
                        icon.style.fontSize = '5rem'; imagePanel.appendChild(icon);
                    }
                    
                    const badge = document.getElementById('modalStoreStatusBadge');
                    const icon = document.getElementById('modalStoreStatusIcon');
                    
                    badge.className = 'badge px-2 py-1 fs-6 border shadow-sm bg-' + color + ' bg-opacity-10 text-' + color + ' border-' + color + ' border-opacity-10';
                                        if(status.toLowerCase().includes('đóng')) {
                        icon.className = 'bi bi-door-closed me-1';
                        document.getElementById('modalStoreCatalogBtn').style.display = 'flex';
                    } else {
                        icon.className = 'bi bi-door-open me-1';
                        document.getElementById('modalStoreCatalogBtn').style.display = 'flex';
                    }
                    
                    // Note: Constructing the link string manually
                    document.getElementById('modalStoreCatalogBtn').href = '/stores/' + slug + '/catagories';
                });
            });
        });
    </script>



    </div>

    
</body>
</html>
