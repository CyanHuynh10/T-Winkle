<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: base('Yêu thích - T-Winkle', ~{::div.wishlist-container})}">
<body>
    <div class="wishlist-container position-relative">
        <div th:replace="~{fragments/navbar :: navbar}"></div>

        <main class="pt-4 mt-2 pb-5 position-relative z-1 storefront-page-main" style="min-height: 80vh;">
            <section class="container mb-4 mb-md-5 pt-4 storefront-heading-section">
                <div class="max-w-4xl mx-auto text-center px-3 animate-fade-up">
                    <h1 class="h3 fw-bold text-dark mb-4 page-heading text-center">Yêu thích</h1>
                </div>
            </section>

            <section class="container pb-4">
                
                                <!-- Empty State -->
                <div id="wishlistEmptyState" class="order-card align-items-center justify-content-center text-center py-5 mx-auto" th:if="${wishlistPage.empty}" style=" min-height: 400px; max-width: 800px; background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(16px); border-radius: 1.5rem; border: 1px solid rgba(255, 255, 255, 0.6); box-shadow: 0 16px 48px rgba(0, 0, 0, 0.1);">
                    <div class="mb-4">
                        <i class="bi bi-heart text-muted-custom" style="font-size: 4rem; opacity: 0.4;"></i>
                    </div>
                    <h4 class="fw-bold text-dark mb-3">Chưa có sản phẩm yêu thích</h4>
                    <p class="text-muted-custom mb-4 max-w-md mx-auto">Bạn chưa thêm sản phẩm nào vào danh sách yêu thích. Hãy lưu lại những món đồ bạn quan tâm nhé!</p>
                    <a th:href="@{/categories}" class="tw-btn tw-btn-primary rounded-pill px-5 py-3 text-white text-decoration-none fw-bold d-inline-flex align-items-center justify-content-center shadow-sm hover-lift">
                        Khám phá sản phẩm
                    </a>
                </div>

                <!-- Wishlist Grid -->
                <div class="row row-cols-2 row-cols-md-3 row-cols-lg-4 g-3 g-md-4 mb-5" th:unless="${wishlistPage.empty}">
                    <div class="col" th:each="product : ${wishlistPage.content}">
                        <div class="glass-card product-card h-100 p-3 pb-4 d-flex flex-column rounded-4 border shadow-sm position-relative bg-white">
                            <form th:action="@{/wishlist/toggle}" method="POST" class="position-absolute top-0 end-0 m-4 z-3">
                                <input type="hidden" name="productId" th:value="${product.productId}">
                                <button type="submit" th:data-product-id="${product.productId}" class="btn btn-sm btn-light rounded-circle shadow-sm wishlist-btn text-danger" aria-label="Bỏ yêu thích" onclick="event.stopPropagation();">
                                    <i class="bi bi-heart-fill"></i>
                                </button>
                            </form>

                            <div class="product-img-wrapper bg-light rounded-3 mb-3 overflow-hidden position-relative" style="aspect-ratio: 1; display: flex; align-items: center; justify-content: center; cursor: pointer;" onclick="showProductDetail(this.getAttribute('data-product-id'))" th:data-product-id="${product.productId}">
                                <img th:if="${product.primaryImagePath != null}" th:src="${product.primaryImagePath}" alt="Product Image" class="w-100 h-100 object-fit-cover">
                                <i th:unless="${product.primaryImagePath != null}" class="bi bi-image text-muted opacity-25" style="font-size: 4rem;"></i>
                            </div>
                            <div class="d-flex flex-column flex-grow-1">
                                <span class="badge text-cyan bg-cyan bg-opacity-10 align-self-start fw-semibold text-xs mb-2 px-2 py-1" th:text="${product.categoryName}">SNEAKER</span>
                                <h3 class="h5 fw-bold text-dark mb-1 text-truncate" th:title="${product.name}" th:text="${product.name}">Product Name</h3>
                                <div class="d-flex flex-wrap align-items-center gap-2 mb-3 text-sm">
                                    <div style="color: #FACC15;">
                                        <i class="bi bi-star-fill"></i>
                                        <span class="text-dark fw-bold ms-1" th:text="${#numbers.formatDecimal(product.ratingAverage, 1, 1)}">5.0</span>
                                    </div>
                                    <span class="text-muted-custom">|</span>
                                    <span class="text-muted-custom text-sm w-100" th:if="${product != null}" th:text="'Đã bán: ' + ${#numbers.formatInteger(product.demoSoldCount > 0 ? product.demoSoldCount : product.soldCount, 1, 'POINT')}"></span>
                                </div>
                                <div class="mt-auto d-flex align-items-center justify-content-between">
                                    <div>
                                        <div class="fw-bold fs-5 text-cyan" th:text="${#numbers.formatDecimal(product.effectivePrice, 0, 'POINT', 0, 'POINT')} + 'đ'">0đ</div>
                                    </div>
                                    
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
<div id="wishlistPaginationWrapper" class="w-100"><div th:replace="~{fragments/product-pagination :: pager(${wishlistPage},'/wishlist')}"></div></div>
            </section>
        </main>

<!-- Detail Product Card Modal -->
        <div th:replace="~{storefront/category/list :: product-detail-modal}"></div>


        <style>
            /* Shared CSS */
            .text-cyan { color: var(--color-primary) !important; }


            .hover-cyan:hover { color: var(--color-primary) !important; }
            .text-muted-custom { color: var(--color-text-muted) !important; }
            .text-xs { font-size: 0.75rem; }

            .glass-search-wrapper:focus-within {
                box-shadow: 0 15px 40px rgba(6, 182, 212, 0.15) !important;
                border-color: var(--color-primary) !important;
            }

            .glass-card {
                background: rgba(255, 255, 255, 0.85);
                backdrop-filter: blur(16px);
                -webkit-backdrop-filter: blur(16px);
                transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s ease;
            }
            .glass-card:hover {
                transform: translateY(-8px);
                box-shadow: 0 15px 30px rgba(6, 182, 212, 0.1) !important;
            }

            .wishlist-btn {
                width: 32px;
                height: 32px;
                display: flex;
                align-items: center;
                justify-content: center;
                transition: all 0.2s ease;
            }
            .wishlist-btn:hover {
                color: var(--color-danger) !important;
                transform: scale(1.1);
            }

            .hover-scale {
                transition: transform 0.2s ease;
            }
            .hover-scale:hover {
                transform: scale(1.05);
            }

            .product-img-wrapper img {
                transition: transform 0.5s ease;
            }
            .product-card:hover .product-img-wrapper img,
            .product-card:hover .product-img-wrapper i {
                transform: scale(1.05);
            }

            @keyframes fadeUp {
                0% { opacity: 0; transform: translateY(20px); }
                100% { opacity: 1; transform: translateY(0); }
            }
            .animate-fade-up {
                animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            }

            @media (prefers-reduced-motion: reduce) {
                .animate-fade-up {
                    animation: none !important;
                }
            }

            .hide-scrollbar::-webkit-scrollbar {
                display: none;
            }
            .hide-scrollbar {
                -ms-overflow-style: none;
                scrollbar-width: none;
            }

            /* Pagination overrides */
            .page-link:hover {
                background-color: var(--color-bg-base) !important;
                color: var(--color-primary) !important;
            }
            .page-item.active .page-link:hover {
                background-color: var(--color-primary-hover) !important;
                color: white !important;
            }
            .page-item.disabled .page-link {
                background-color: transparent !important;
                border: none !important;
                opacity: 0.5;
            }

            /* Modal / Divider */
            .custom-scrollbar::-webkit-scrollbar {
                width: 6px;
            }
            .custom-scrollbar::-webkit-scrollbar-track {
                background: rgba(0, 0, 0, 0.02);
                border-radius: 4px;
            }
            .custom-scrollbar::-webkit-scrollbar-thumb {
                background: rgba(0, 0, 0, 0.15);
                border-radius: 4px;
            }
            .custom-scrollbar::-webkit-scrollbar-thumb:hover {
                background: rgba(0, 0, 0, 0.25);
            }
            .detail-divider-panel {
                border-bottom: 1px solid rgba(0, 0, 0, 0.25);
            }
            @media (min-width: 992px) {
                .detail-divider-panel {
                    border-bottom: none !important;
                    border-right: 1px solid rgba(0, 0, 0, 0.25);
                }
                .modal-16-9 .modal-content {
                    aspect-ratio: 16 / 9;
                    max-height: 85vh;
                }
            }
        </style>

        

</div>
</body>
</html>
